const eligible = (q) => ['oficial-gabarito-conferido', 'resolucao-independente-revisada'].includes(q.status);

const daysUntil = (date, now = new Date()) => Math.max(0, Math.ceil((new Date(`${date}T00:00:00-03:00`).getTime() - now.getTime()) / 86400000));
function pickAdaptive(questions, responses, count) {
    const records = new Map();
    for (const r of responses) {
        records.set(r.questionId, [...(records.get(r.questionId) || []), r]);
    }
    const areaUsed = new Map();
    const results = [];
    const candidates = questions.filter(eligible).sort((a, b) => a.id.localeCompare(b.id));
    while (results.length < count && candidates.length) {
        let winner = 0, best = -Infinity;
        for (let i = 0; i < candidates.length; i++) {
            const q = candidates[i], hist = records.get(q.id) || [], miss = hist.filter(x => !x.correct).length, last = hist[hist.length - 1];
            const priority = (hist.length === 0 ? 8 : 0) + (last && !last.correct ? 12 : 0) + miss * 2 - hist.length * 1.5 - (areaUsed.get(q.areaId) || 0) * 5 + (q.difficulty === 'Média' ? 1 : 0);
            if (priority > best) {
                best = priority;
                winner = i;
            }
        }
        const q = candidates.splice(winner, 1)[0];
        results.push(q);
        areaUsed.set(q.areaId, (areaUsed.get(q.areaId) || 0) + 1);
    }
    return results;
}

                last.set(r.questionId, r.correct);
            const qs = defaultCandidates().filter(q => last.get(q.id) === false);
            if (qs.length)
                createAttempt('Revisão dos erros', qs, 'practice', Math.max(15, qs.length * 4));
            else
                flash('Você ainda não tem questões erradas para revisar.');
            break;
        }
        case 'flag': {
            const a = attemptsActive();
            if (a) {
                const id = a.questionIds[a.index];
                a.flagged = a.flagged.includes(id) ? a.flagged.filter(x => x !== id) : [...a.flagged, id];
                persist();
                render();
            }
            break;
        }
        case 'clear-attempt-choice': {
            const a = attemptsActive();
            if (a) {
                delete a.choices[a.questionIds[a.index]];
                persist();
                render();
            }
            break;
        }
        case 'prev-attempt':
        case 'next-attempt': {
            const a = attemptsActive();
            if (a && !a.pauseSince) {
                a.index = Math.max(0, Math.min(a.questionIds.length - 1, a.index + (d.action === 'next-attempt' ? 1 : -1)));
                persist();
                render();
            }
            break;
        }
        case 'leave-attempt':
            activeAttempt = null;
            go('sim');
            break;
        case 'pause-attempt': {
            const a = attemptsActive();
            if (a && a.mode === 'practice') {
                if (a.pauseSince) {
                    const delta = Date.now() - a.pauseSince;
                    a.pausedSeconds += delta / 1000;
                    a.endsAt += delta;
                    a.pauseSince = null;
                }
                else
                    a.pauseSince = Date.now();
                persist();
                render();
            }
            break;
        }
        case 'finish-attempt':
            finishAttempt();
            break;
        case 'save-discursive':
            persist();
            flash('Rascunho salvo.');
            break;
        case 'export': {
            const json = JSON.stringify(progress, null, 2), blob = new Blob([json], { type: 'application/json' }), url = URL.createObjectURL(blob), link = document.createElement('a');
            link.href = url;
            link.download = `enade-backup-${new Date().toISOString().slice(0, 10)}.json`;
            link.click();
            setTimeout(() => URL.revokeObjectURL(url), 1000);
            break;
        }
        case 'delete-all':
            if (confirm('Tem certeza que deseja apagar todas as suas respostas, aulas e rascunhos neste dispositivo?')) {
                progress = initialProgress();
                persist();
                go('home');
                flash('Dados locais apagados.');
            }
            break;
    }
});
root.addEventListener('change', ev => { const t = ev.target; if (t.name === 'learn-choice') {
    quizSelected = Number(t.value);
    render();
    return;
} if (t.name === 'attempt-choice') {
    const a = attemptsActive();
    if (a && !a.pauseSince) {
        a.choices[a.questionIds[a.index]] = Number(t.value);
        persist();
        render();
    }
    return;
} if (t.id === 'groupFilter') {
    groupFilter = t.value;
    render();
    return;
} if (t.id === 'difficultyFilter') {
    difficultyFilter = t.value;
    render();
    return;
} if (t.id === 'simArea') {
    areaId = t.value;
    return;
} if (t.id === 'discSelect') {
    selectedDisc = t.value;
    render();
    return;
} if (t.id === 'statsPeriod') {
    statsPeriod = t.value;
    render();
    return;
} if (t.id === 'restore-file') {
    const file = t.files?.[0];
    if (!file)
        return;
    file.text().then(s => { const parsed = restore(JSON.parse(s)); if (confirm('Restaurar este backup? O progresso atual será substituído.')) {
        progress = parsed;
        persist();
        go('home');
        flash('Backup restaurado.');
    } }).catch(e => alert(`Falha ao restaurar: ${e.message}`));
    return;
} });
root.addEventListener('input', ev => { const t = ev.target; if (t.id === 'search') {
    const start = t.selectionStart || t.value.length;
    search = t.value;
    render();
    const inp = document.querySelector('#search');
    inp?.focus();
    inp?.setSelectionRange(start, start);
    return;
} if (t.id === 'discText') {
    progress.discursive[selectedDisc] = t.value;
    persist();
    const label = document.getElementById('discSaved');
    if (label)
        label.textContent = `${t.value.length} caracteres · salvo automaticamente`;
    return;
} });
window.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden')
    persist(); });
load().then(p => { progress = p; render();  }).catch(() => render());
</script></body></html>
