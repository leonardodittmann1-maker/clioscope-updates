</style></head><body><div id="app"></div><script>const initialProgress = () => ({ schema: 1, responses: [], attempts: [], completedLessons: [], bookmarks: [], discursive: {}, minutes: 0, settings: { theme: 'light', session: 45 }, revisionDates: {}, studySessions: [] });
/** Apenas questões completas com resolução revisada podem gerar respostas e avaliações.
 * O registro de um gabarito oficial, isoladamente, não valida o enunciado.
 */
const eligible = (q) => q.status === 'resolucao-independente-revisada' && !q.needsSource &&
    q.choices.length === 5 && q.choices.every(c => Boolean(c.trim()) && !/consulte o pdf|consulte o caderno/i.test(c)) &&
    !/abra o caderno oficial|consulte o pdf|texto não foi copiado/i.test(q.prompt);
const score = (answers, questions) => ({ total: questions.length, answered: questions.filter(q => answers[q.id] !== undefined).length, correct: questions.filter(q => answers[q.id] === q.answer).length });
const daysUntil = (date, now = new Date()) => Math.max(0, Math.ceil((new Date(`${date}T00:00:00-03:00`).getTime() - now.getTime()) / 86400000));
function pickAdaptive(questions, responses, count) {
    const records = new Map();
    for (const r of responses) {
        records.set(r.questionId, [...(records.get(r.questionId) || []), r]);
    }
    const areaUsed = new Map();
    const results = [];
    const candidates = questions.filter(eligible).sort((a, b) => a.id.localeCompare(b.id));
    while (results.length < count && candidates.length) {
        let winner = 0, best = -Infinity;
        for (let i = 0; i < candidates.length; i++) {
            const q = candidates[i], hist = records.get(q.id) || [], miss = hist.filter(x => !x.correct).length, last = hist[hist.length - 1];
            const priority = (hist.length === 0 ? 8 : 0) + (last && !last.correct ? 12 : 0) + miss * 2 - hist.length * 1.5 - (areaUsed.get(q.areaId) || 0) * 5 + (q.difficulty === 'Média' ? 1 : 0);
            if (priority > best) {
                best = priority;
                winner = i;
            }
        }
        const q = candidates.splice(winner, 1)[0];
        results.push(q);
        areaUsed.set(q.areaId, (areaUsed.get(q.areaId) || 0) + 1);
    }
    return results;
}

const OFFICIAL_SOURCES = {
    2023: { exam: 'https://download.inep.gov.br/enade/provas_e_gabaritos/2023_PV_engenharia_eletrica.pdf', key: 'https://download.inep.gov.br/enade/provas_e_gabaritos/2023_GB_engenharia_eletrica.pdf', origin: 'Inep — prova e gabarito definitivo 2023' },
    2019: { exam: 'https://download.inep.gov.br/educacao_superior/enade/provas/2019/ENGENHARIA_ELETRICA.pdf', key: 'https://download.inep.gov.br/educacao_superior/enade/gabaritos/2019/engenharia_eletrica.pdf', origin: 'Inep — prova e gabarito definitivo 2019' },
    2017: { exam: 'https://download.inep.gov.br/educacao_superior/enade/provas/2017/16_ENG_ELE_BACHAREL_BAIXA.pdf', key: 'https://download.inep.gov.br/educacao_superior/enade/gabaritos/2017/16_Engenharia_Eletrica.pdf', origin: 'Gabarito definitivo Engenharia Elétrica 2017 (cópia da Univali conferida, não confundir com gabaritos de outras Engenharias)' }
};
// Uma letra por questão objetiva, na ordem oficial; X representa ANULADA.
// Lista explícita sem depender da formatação de texto do PDF.
const KEYS = {
    2023: ['D', 'D', 'B', 'A', 'E', 'C', 'A', 'B', 'E', 'A', 'A', 'E', 'C', 'B', 'A', 'D', 'B', 'E', 'D', 'A', 'B', 'D', 'C', 'D', 'A', 'E', 'D', 'D', 'B', 'ANULADA', 'C', 'A', 'D', 'E', 'C', 'A', 'E', 'B'],
    2019: ['ANULADA', 'D', 'C', 'B', 'C', 'C', 'D', 'B', 'ANULADA', 'A', 'C', 'D', 'B', 'B', 'A', 'D', 'D', 'A', 'B', 'E', 'E', 'ANULADA', 'E', 'C', 'ANULADA', 'A', 'E', 'ANULADA', 'B', 'C', 'D', 'B', 'ANULADA', 'B', 'C'],
    2017: ['C', 'C', 'B', 'B', 'C', 'E', 'A', 'D', 'E', 'D', 'C', 'A', 'E', 'A', 'B', 'C', 'D', 'B', 'C', 'A', 'D', 'E', 'E', 'B', 'B', 'D', 'D', 'A', 'A', 'E', 'C', 'B', 'D', 'C', 'C']
};
const OFFICIAL_ITEMS = [2023, 2019, 2017].flatMap(year => KEYS[year].map((answer, i) => {
    const number = i + 1, section = (year === 2023 ? number <= 9 : number <= 8) ? 'geral' : 'especifico', s = OFFICIAL_SOURCES[year];
    return { id: `INEP-${year}-EE-Q${String(number).padStart(2, '0')}`, year: year, number, section, answer, examUrl: s.exam, keyUrl: s.key, sourceNote: s.origin };
}));
const OFFICIAL_DISCURSIVES = [2023, 2019, 2017].flatMap(year => Array.from({ length: year === 2023 ? 2 : 5 }, (_, i) => {
    const number = i + 1, s = OFFICIAL_SOURCES[year];
    return { id: `INEP-${year}-EE-D${number}`, year: year, number, section: (year === 2023 ? number === 1 : number <= 2) ? 'geral' : 'especifico', examUrl: s.exam, sourceNote: s.origin };
}));
const OFFICIAL_QUESTIONS = OFFICIAL_ITEMS.filter(item => item.answer !== 'ANULADA' && item.id !== 'INEP-2023-EE-Q10').map(item => ({
    id: item.id, year: item.year, areaId: item.section === 'geral' ? 'FG00' : 'EE00',
    topic: `ENADE ${item.year} — questão ${String(item.number).padStart(2, '0')} (${item.section === 'geral' ? 'Formação Geral' : 'Componente Específico'})`,
    prompt: `Questão oficial ${item.number} do ENADE Engenharia Elétrica ${item.year}. Abra o caderno oficial abaixo para ler o enunciado completo, as alternativas e os diagramas antes de responder. O texto não foi copiado para este aplicativo.`,
    choices: ['Alternativa A (consulte o PDF)', 'Alternativa B (consulte o PDF)', 'Alternativa C (consulte o PDF)', 'Alternativa D (consulte o PDF)', 'Alternativa E (consulte o PDF)'],
    answer: 'ABCDE'.indexOf(item.answer), why: `O gabarito definitivo do Inep registra a alternativa ${item.answer} para a questão ${item.number} de ${item.year}. A resolução detalhada independente ainda não foi revisada; consulte o caderno para estudar a justificativa.`,
    hints: ['Abra o caderno de prova e localize a questão pelo número.', 'Resolva no papel antes de assinalar a resposta no aplicativo.'],
    difficulty: 'Média', origin: 'oficial-referenciada', source: item.examUrl, needsSource: true,
    status: 'oficial-gabarito-conferido', revisionDate: '2026-10-30'
}));
const OFFICIAL_ANNULLED = OFFICIAL_ITEMS.filter(i => i.answer === 'ANULADA');

const ADV = (id, areaId, lessonId, topic, prompt, choices, answer, why, hints, calculation) => ({ id, areaId, lessonId, topic, prompt, choices, answer, why, hints, difficulty: 'Difícil', level: 'padrao-enade', origin: 'autoral', year: 2026, source: 'Questão autoral de treinamento. Competências da Portaria Inep 164/2026; não reproduz item do INEP.', status: 'resolucao-independente-revisada', revisionDate: '2026-11-05', calculation });
const ADVANCED_QUESTIONS = [
    ADV('ADV-001', 'EE11', 'potencia-trifasica', 'Compensação de reativos', 'Uma indústria demanda 200 kW de potência ativa, com cargas indutivas e fator de potência de 0,72. Pretende-se elevar o fator de potência global para 0,95 por compensação capacitiva ideal, mantendo a potência ativa e sem considerar harmônicos. Qual potência reativa nominal aproximada deve ser compensada?', ['52 kvar', '87 kvar', '127 kvar', '181 kvar', '278 kvar'], 2, '1) Q inicial = P·tan(arccos 0,72) ≈ 192,8 kvar. 2) Q final = P·tan(arccos 0,95) ≈ 65,7 kvar. 3) Compensação Qc = Qi−Qf ≈ 127,0 kvar. O banco exige dimensionamento por degraus e estudo de harmônicos/ressonância na prática; fator de potência elevado não elimina toda corrente reativa.', ['A potência ativa permanece em 200 kW.', 'Compare a potência reativa antes e depois da compensação.', 'Use Qc=P[tan(arccos fpi)−tan(arccos fpf)].'], '200*(tan(acos(.72))-tan(acos(.95)))≈127.03 kvar'),
    ADV('ADV-002', 'EE11', 'potencia-trifasica', 'Corrente, fator de potência e cabos', 'Um alimentador trifásico equilibrado fornece 100 kW a uma carga senoidal com tensão de linha de 480 V e fator de potência 0,82. Desprezando perdas do alimentador, qual corrente de linha deve ser considerada inicialmente na avaliação térmica dos condutores?', ['104,2 A', '120,2 A', '146,7 A', '175,8 A', '254,0 A'], 2, '1) Em carga trifásica equilibrada, P=√3·Vlinha·Ilinha·FP. 2) I=P/(√3·V·FP). 3) I=100000/(√3·480·0,82)=146,7 A. É apenas uma etapa do dimensionamento; capacidade de condução, método de instalação, queda de tensão e curto-circuito também importam.', ['Observe que são 100 kW ativos, não 100 kVA.', 'Utilize grandezas de linha.', 'Não esqueça o fator de potência no denominador.'], '100000/(sqrt(3)*480*.82)=146.68 A'),
    ADV('ADV-003', 'EE11', 'curto-circuito-pu', 'Curto-circuito em base por unidade', 'Um transformador trifásico de 10 MVA e 13,8 kV no lado analisado apresenta reatância de curto-circuito de 0,20 pu na própria base. Considere fonte de potência de curto-circuito infinita, tensão pré-falta de 1 pu e despreze resistência. Qual é a corrente inicial simétrica aproximada de uma falta trifásica nos terminais?', ['0,42 kA', '1,05 kA', '2,09 kA', '5,23 kA', '10,46 kA'], 2, '1) Corrente-base: Ib=Sbase/(√3·Vbase)=10 MVA/(√3·13,8 kV)=418,4 A. 2) Para V=1 pu e X=0,20 pu, Ifpu=1/0,20=5 pu. 3) If=5·418,4 A≈2,09 kA. Este é modelo simplificado; rede a montante e impedâncias adicionais alteram o resultado.', ['Converta primeiro 10 MVA e 13,8 kV para corrente-base.', 'A corrente de falta em pu é Vpu/Zpu.', 'Multiplique o resultado em pu pela corrente-base.'], '(10e6/(sqrt(3)*13800))/.2≈2091.85 A'),
    ADV('ADV-004', 'EE12', 'solar-estimativa', 'Perdas técnicas em alimentador', 'Durante uma medição, cada fase de um alimentador trifásico equilibrado conduz 50 A eficazes. A resistência total equivalente de cada condutor de fase, na temperatura de operação, é 0,28 Ω. Desconsiderando neutro e efeitos adicionais, qual é a perda ativa total por efeito Joule nas três fases?', ['0,70 kW', '1,40 kW', '2,10 kW', '3,50 kW', '7,00 kW'], 2, 'Cada fase dissipa I²R=50²·0,28=700 W. Como são três fases equivalentes, Pperdas=3·700=2100 W=2,10 kW. Usar apenas I²R daria a perda por fase, não o total.', ['Calcule I²R de um condutor.', 'Há três condutores de fase com a mesma corrente.'], '3*50^2*.28=2100 W'),
    ADV('ADV-005', 'EE15', 'maquina-inducao', 'Escorregamento de motor de indução', 'Um motor de indução trifásico de quatro polos é alimentado a 60 Hz. Sob carga, a rotação medida é 1746 rpm. Qual o escorregamento percentual aproximado?', ['1,5%', '2,0%', '3,0%', '4,0%', '6,0%'], 2, '1) A rotação síncrona de um motor de 4 polos em 60 Hz é ns=120·f/p=1800 rpm. 2) O escorregamento é s=(ns−n)/ns=(1800−1746)/1800=0,03=3%. Em motores de indução, a rotação do rotor é menor que a síncrona em regime motor.', ['Calcule a rotação síncrona com 120f/p.', 'Subtraia a velocidade do rotor da velocidade síncrona.'], '(1800-1746)/1800*100=3%'),
    ADV('ADV-006', 'EE15', 'maquina-inducao', 'Torque útil no eixo', 'Um motor entrega 15 kW de potência mecânica útil no eixo a 1746 rpm. Admitindo regime permanente, qual o torque útil aproximado em N·m?', ['41 N·m', '65 N·m', '82 N·m', '105 N·m', '164 N·m'], 2, 'A potência mecânica no eixo é P=T·ω e ω=2πn/60. Então T=15000/[2π·1746/60]≈82,0 N·m. O cálculo usa potência mecânica útil; se fosse potência elétrica de entrada, seria necessário considerar o rendimento.', ['Converta rpm em rad/s.', 'A potência fornecida já é mecânica útil.'], '15000/(2*pi*1746/60)≈82.05 Nm'),
    ADV('ADV-007', 'EE06', 'transitorios-rlc', 'Resposta transitória RL', 'Uma bobina ideal de 0,4 H e resistência série de 8 Ω é conectada a uma fonte contínua ideal em t=0. A corrente inicial é zero. Em t=0,10 s, qual fração aproximada da corrente final terá sido atingida?', ['36,8%', '50,0%', '63,2%', '86,5%', '98,2%'], 3, '1) A constante de tempo do circuito é τ=L/R=0,4/8=0,05 s. 2) A resposta à energização é i(t)/i∞=1−exp(−t/τ). 3) Em 0,10 s, t/τ=2, logo 1−e^(−2)=0,8647≈86,5%. A exponencial não representa crescimento linear.', ['Calcule τ=L/R.', 'Divida o instante por τ.', 'Use 1−exp(−t/τ).'], '100*(1-exp(-.1/(.4/8)))=86.466%'),
    ADV('ADV-008', 'EE06', 'transitorios-rlc', 'Constante de tempo RC', 'Um capacitor inicialmente descarregado é carregado por uma fonte ideal através de R=10 kΩ e C=100 µF. A partir de qual instante a tensão alcança aproximadamente metade do valor final, no modelo RC ideal?', ['0,069 s', '0,347 s', '0,693 s', '1,000 s', '1,443 s'], 2, 'τ=RC=10000·100·10⁻⁶=1 s. Como v/Vfinal=1−exp(−t/τ), a condição v/Vfinal=0,5 implica exp(−t/τ)=0,5 e t=τ·ln 2≈0,693 s. A metade ocorre antes de uma constante de tempo, quando a tensão estaria em 63,2%.', ['Determine a constante de tempo RC.', 'Resolva exp(−t/τ)=0,5.'], '1*ln(2)=.693147 s'),
    ADV('ADV-009', 'EE06', 'transitorios-rlc', 'Ressonância RLC série', 'Um circuito RLC série apresenta L=20 mH e C=100 µF. No modelo ideal, qual a frequência de ressonância aproximadamente?', ['35,6 Hz', '79,6 Hz', '112,5 Hz', '159,2 Hz', '355,9 Hz'], 2, 'Na ressonância série, as reatâncias indutiva e capacitiva se cancelam: ω0=1/√(LC). Portanto f0=1/(2π√(0,020·100·10⁻⁶))≈112,5 Hz. A resistência afeta o amortecimento e a largura de banda, não a expressão ideal indicada.', ['Converta mH e µF para unidades SI.', 'Use f0=1/(2π√LC).'], '1/(2*pi*sqrt(.02*100e-6))≈112.54 Hz'),
    ADV('ADV-010', 'EE18', 'controle-malha', 'Realimentação não unitária', 'Um sistema de controle com realimentação negativa tem ganho direto estático G=5 e sensor com ganho H=0,2. Para uma entrada constante de amplitude 10, considere linearidade e regime permanente. Qual valor de saída é previsto pelo modelo em malha fechada?', ['5', '10', '20', '25', '50'], 3, 'O ganho de referência para saída é T=G/(1+GH)=5/(1+1)=2,5. Para a entrada de amplitude 10, y=2,5·10=25. Atenção: a realimentação não é unitária; usar G/(1+G) seria incorreto.', ['Primeiro calcule GH.', 'Use T=G/(1+GH) e multiplique pela referência.'], '(5/(1+5*.2))*10=25'),
    ADV('ADV-011', 'EE10', 'votacao-protecao', 'Confiabilidade de votação 2 de 3', 'Uma lógica de proteção utiliza votação 2 de 3 entre sensores independentes. Cada sensor tem probabilidade 0,90 de detectar corretamente uma condição de disparo. A lógica atua quando pelo menos dois sensores detectam. Qual a probabilidade de atuação correta, desconsiderando falhas de lógica e de canais comuns?', ['72,9%', '81,0%', '90,0%', '97,2%', '99,9%'], 3, 'Há duas situações favoráveis: exatamente dois sensores corretos, com probabilidade C(3,2)·p²·(1−p)=3·0,9²·0,1=0,243; e três corretos, com p³=0,729. Total=0,972=97,2%. Independência é hipótese crucial; falhas comuns comprometem a vantagem da redundância.', ['Use distribuição binomial.', 'Some P(exatamente 2) com P(exatamente 3).'], '3*.9^2*.1+.9^3=.972'),
    ADV('ADV-012', 'EE19', 'bayes-confiabilidade', 'Redundância e falhas independentes', 'Duas unidades redundantes e independentes devem manter uma função enquanto pelo menos uma funciona. Cada unidade tem probabilidade 0,02 de falhar no intervalo analisado. Qual a probabilidade de perda total da função nesse intervalo?', ['0,0004 (0,04%)', '0,0200 (2%)', '0,0396 (3,96%)', '0,0400 (4%)', '0,9604 (96,04%)'], 0, 'A função somente é perdida se as duas unidades falharem: P(F1∩F2)=P(F1)P(F2)=0,02²=0,0004, correspondente a 0,04%. O resultado não vale na presença de falha de causa comum.', ['Identifique o evento que causa perda total.', 'Como as falhas são independentes, multiplique.'], '0.02^2=.0004'),
    ADV('ADV-013', 'EE05', 'nyquist', 'Aliasing em aquisição de vibração', 'Um sinal senoidal de frequência 850 Hz é amostrado uniformemente a 1200 amostras/s, sem filtro anti-aliasing. Considerando a banda de 0 a fs/2, qual frequência aparente será observada após a amostragem?', ['150 Hz', '250 Hz', '350 Hz', '600 Hz', '850 Hz'], 2, 'A frequência de Nyquist é fs/2=600 Hz. Como 850 Hz excede esse valor, a componente se reflete: f_alias=|850−1200|=350 Hz. O sistema medirá uma componente indistinguível de 350 Hz; sem filtro anti-aliasing, o problema não é resolvido aumentando apenas a resolução em bits.', ['Qual é a frequência de Nyquist?', 'Reflita a frequência acima de fs/2 para a banda observável.'], 'abs(850-1200)=350 Hz'),
    ADV('ADV-014', 'EE14', 'adc-calibracao', 'ADC e resolução de medição', 'Um conversor analógico-digital ideal de 12 bits recebe tensão na faixa unipolar de 0 a 10 V. Qual a resolução aproximada de um passo de quantização, usando 2¹² níveis?', ['0,24 mV', '1,22 mV', '2,44 mV', '4,88 mV', '24,4 mV'], 2, 'Um ADC ideal de 12 bits possui 2¹²=4096 códigos. O tamanho aproximado do LSB é 10 V/4096≈0,002441 V=2,44 mV. Resolução não é sinônimo de exatidão, pois ruído, erro de offset e não linearidade podem dominar a medição real.', ['Quantos níveis existem em 12 bits?', 'Divida a amplitude de 10 V pelo número de níveis.'], '10000/4096≈2.441 mV'),
    ADV('ADV-015', 'EE11', 'potencia-trifasica', 'Ligação em triângulo', 'Uma carga trifásica equilibrada resistiva é ligada em triângulo à rede de 400 V entre linhas. Cada ramo possui resistência de 20 Ω e todas as tensões são senoidais. Qual é a potência ativa total?', ['4 kW', '8 kW', '12 kW', '24 kW', '48 kW'], 3, 'Em triângulo, cada resistor recebe a tensão de linha de 400 V. A potência por ramo é Pφ=V²/R=400²/20=8000 W. Três ramos dissipam 3·8000=24000 W=24 kW. Tratar a tensão como Vlinha/√3 confunde triângulo com estrela.', ['Qual tensão recebe cada ramo em triângulo?', 'Calcule P=V²/R para um ramo e multiplique por três.'], '3*400^2/20=24000 W'),
    ADV('ADV-016', 'EE11', 'potencia-trifasica', 'Ligação em estrela', 'Uma carga trifásica equilibrada resistiva é ligada em estrela a uma fonte de 400 V entre linhas. Cada fase tem 20 Ω. Qual é a potência total aproximada?', ['4 kW', '8 kW', '12 kW', '24 kW', '48 kW'], 1, 'Em estrela equilibrada, a tensão de fase é Vφ=400/√3≈230,94 V. Cada fase dissipa Vφ²/R≈2666,7 W. Somando as três fases, Ptotal=3·Vφ²/R=400²/20=8000 W=8 kW. A comparação com a ligação em triângulo mostra a importância da tensão de fase.', ['Em estrela, a tensão de fase não é igual à tensão de linha.', 'Use Vφ=Vlinha/√3 e calcule três fases.'], '3*(400/sqrt(3))^2/20=8000 W'),
    ADV('ADV-017', 'EE15', 'maquina-inducao', 'Rendimento de transformador real', 'Durante ensaio de um transformador, a carga recebe 250 kW de potência ativa. As perdas no ferro e no cobre, nas condições avaliadas, são 5 kW e 8 kW, respectivamente. Qual rendimento aproximado?', ['91,0%', '93,0%', '95,1%', '97,0%', '98,0%'], 2, 'A potência de entrada é a potência entregue mais perdas: Pin=250+5+8=263 kW. O rendimento é η=Pout/Pin=250/263≈0,95057=95,1%. Não dividir pelas perdas nem usar kVA sem conhecer o fator de potência.', ['Some as perdas à potência de saída.', 'η=Psaida/(Psaida+perdas).'], '250/(250+5+8)*100≈95.057%'),
    ADV('ADV-018', 'EE01', 'economia-projeto', 'Análise de retorno simples', 'Uma melhoria energética exige investimento inicial de R$ 100.000. Ela gera economia bruta de R$ 20.000 por ano, mas exige R$ 8.000 anuais de manutenção adicional. Desprezando inflação, tributos e valor temporal do dinheiro, qual o tempo de retorno simples?', ['5,0 anos', '6,3 anos', '8,3 anos', '10,0 anos', '12,5 anos'], 2, 'O benefício líquido anual é R$ 20.000−R$ 8.000=R$ 12.000. Payback simples=investimento/benefício líquido=100000/12000≈8,33 anos. O retorno simples não é VPL e não considera custo de capital; deve ser evitado como único critério de investimento.', ['Calcule a economia líquida anual.', 'Divida o investimento inicial pela economia líquida.'], '100000/(20000-8000)=8.333 years'),
    ADV('ADV-019', 'EE12', 'solar-estimativa', 'Estimativa de geração fotovoltaica', 'Um sistema fotovoltaico tem potência instalada de 5 kWp, irradiação diária média equivalente a 5,2 horas de sol pleno e taxa de desempenho global (PR) estimada em 0,78. Qual a energia elétrica diária aproximada, sob essas hipóteses?', ['15,6 kWh', '18,2 kWh', '20,3 kWh', '25,0 kWh', '33,3 kWh'], 2, 'A aproximação usual é E=Ppico·HSP·PR. Portanto E=5 kWp·5,2 h·0,78=20,28 kWh por dia. A estimativa não substitui análise de sombreamento, orientação, temperatura, degradação e sazonalidade.', ['Horas de sol pleno representam energia solar diária equivalente.', 'Multiplique potência de pico, HSP e PR.'], '5*5.2*.78=20.28 kWh/day'),
    ADV('ADV-020', 'EE08', 'magnetismo', 'Lei de Faraday', 'Uma bobina de 250 espiras sofre variação aproximadamente uniforme do fluxo magnético por espira, de 5 mWb para 1 mWb, em 0,04 s. Qual é o módulo da força eletromotriz média induzida?', ['2,5 V', '10 V', '20 V', '25 V', '100 V'], 3, 'Pela lei de Faraday, |e|=N·|ΔΦ|/Δt. A variação por espira é |1−5| mWb=0,004 Wb. Então |e|=250·0,004/0,04=25 V. O sinal da tensão depende da convenção de polaridade e corresponde à oposição da lei de Lenz.', ['Converta mWb em Wb.', 'Multiplique a variação de fluxo pelo número de espiras.'], '250*.004/.04=25 V'),
    ADV('ADV-021', 'EE15', 'maquina-inducao', 'Potência no rotor de motor de indução', 'Em regime motor, um motor de indução apresenta potência transferida pelo entreferro de 50 kW e escorregamento de 4%. No modelo clássico, qual potência é dissipada por efeito Joule no circuito equivalente do rotor?', ['0,5 kW', '1,0 kW', '2,0 kW', '4,0 kW', '48,0 kW'], 2, 'A potência dissipada no rotor é Pcu,rotor=s·Pag=0,04·50 kW=2,0 kW. A potência mecânica eletromagnética convertida é (1−s)·Pag=48 kW, antes de perdas mecânicas adicionais.', ['O escorregamento é uma fração: 4%=0,04.', 'Use Pcu,rotor=s·Potência do entreferro.'], '0.04*50=2 kW'),
    ADV('ADV-022', 'EE13', 'tcs-protecao', 'Transformador de corrente em proteção', 'Um transformador de corrente ideal apresenta relação 600/5 A. Durante uma falta, a corrente primária simétrica é de 3600 A. Qual corrente secundária ideal corresponde a esse valor, desprezando saturação e carga secundária?', ['5 A', '15 A', '20 A', '30 A', '60 A'], 3, 'A relação nominal é 600/5=120:1. Assim, Isec=3600/120=30 A. O resultado é ideal; em faltas elevadas, saturação do núcleo, remanência e burden precisam ser avaliados antes de inferir o sinal real visto pelo relé.', ['Calcule a relação primário/secundário.', 'Divida 3600 A pela relação 120.'], '3600/(600/5)=30 A'),
    ADV('ADV-023', 'EE06', 'transitorios-rlc', 'Descarga exponencial de capacitor', 'Um capacitor ideal de 470 µF é inicialmente carregado a 100 V e depois descarrega exclusivamente por um resistor de 2 kΩ. Em que instante, aproximadamente, a tensão atinge 25 V?', ['0,33 s', '0,65 s', '0,94 s', '1,30 s', '2,60 s'], 3, 'A constante de tempo é τ=RC=2000·470·10⁻⁶=0,94 s. Na descarga, v(t)=V0 exp(−t/τ), então t=τ·ln(V0/V)=0,94·ln 4≈1,303 s. Não confunda atingir 25% com passar um quarto do tempo de descarga.', ['Encontre τ=RC.', 'Resolva exp(−t/τ)=0,25.'], '2000*470e-6*ln(4)=1.303 s'),
    ADV('ADV-024', 'EE19', 'bayes-confiabilidade', 'Probabilidade condicional e falso positivo', 'Uma falha rara ocorre em 1% dos equipamentos. Um teste identifica corretamente 95% dos equipamentos com falha (sensibilidade), mas indica positivo em 5% dos equipamentos sem falha. Para um resultado positivo, qual a probabilidade aproximada de que o equipamento realmente esteja com falha?', ['1,0%', '5,0%', '16,1%', '50,0%', '95,0%'], 2, 'P(falha|positivo)=P(positivo|falha)·P(falha)/P(positivo). O numerador é 0,95·0,01=0,0095. O denominador soma positivos verdadeiros e falsos: 0,0095+0,05·0,99=0,059. Resultado 0,0095/0,059≈0,161=16,1%. Um teste sensível não implica alta probabilidade posterior quando o evento é raro.', ['Faça uma árvore de probabilidade para falha e não falha.', 'Calcule os positivos verdadeiros e falsos.', 'Use o teorema de Bayes.'], '(.95*.01)/(.95*.01+.05*.99)=.1610'),
    ADV('ADV-025', 'EE18', 'estabilidade-polos', 'Estabilidade de segunda ordem', 'A função de transferência de malha fechada de um sistema linear e invariante no tempo tem denominador s²+4s+13. Considerando o modelo contínuo, o que se pode afirmar sobre a estabilidade e a natureza dos polos?', ['Instável com dois polos reais positivos.', 'Estável com polos −2±j3.', 'Estável com polos +2±j3.', 'Marginalmente estável com polos imaginários puros.', 'Instável por conter dois polos complexos.'], 1, 'Resolver s²+4s+13=0 dá s=[−4±√(16−52)]/2=−2±j3. Os polos possuem parte real negativa; assim, o sistema contínuo é assintoticamente estável no modelo linear. A parte imaginária provoca oscilação amortecida.', ['Use a fórmula de Bhaskara.', 'A estabilidade depende do sinal da parte real dos polos.'], 'roots of s²+4s+13 => -2±3j'),
    ADV('ADV-026', 'EE11', 'potencia-trifasica', 'Fator de potência e corrente de entrada', 'Uma carga trifásica equilibrada consome 90 kW sob tensão de linha constante de 400 V. Após compensação de reativos, seu fator de potência muda de 0,75 para 0,90 sem alteração da potência ativa. Qual a redução relativa aproximada da corrente de linha?', ['8,3%', '12,5%', '16,7%', '20,0%', '25,0%'], 2, 'Com P e V constantes, a corrente é inversamente proporcional ao fator de potência: If/Ii=FPi/FPf=0,75/0,90=0,8333. A redução relativa é (1−0,8333)·100≈16,7%. Não é necessário conhecer a corrente absoluta para comparar os dois regimes.', ['As duas operações têm mesma P e V.', 'A corrente é proporcional a 1/FP.'], '(1-0.75/0.9)*100=16.67%')
];

const f = (id, areaId, name, expression, variables, use, limits, example, pitfall, related = []) => ({ id, areaId, name, expression, variables, use, limits, example, pitfall, related, source: 'Referência conceitual: Portaria Inep 164/2026; dedução e exemplo autorais. Frequência em ENADE anteriores: não auditada.' });
const FORMULAS = [
    f('f-ohm', 'EE06', 'Lei de Ohm', 'V = R · I', ['V: tensão (V)', 'I: corrente (A)', 'R: resistência (Ω)'], 'Determinar grandeza desconhecida em elemento ôhmico.', 'Modelo de resistor linear com R definida na condição de operação.', 'Se V=24 V e R=12 Ω, I=24/12=2 A.', 'Não aplicar a componentes não lineares como se R fosse constante.', ['AUT-001', 'AUT-022']),
    f('f-joule', 'EE06', 'Potência dissipada em resistor', 'P = V · I = I² · R = V²/R', ['P: potência ativa (W)', 'V: tensão (V)', 'I: corrente (A)', 'R: resistência (Ω)'], 'Verificar dissipação de componentes e perdas em cabos.', 'Senoidal em resistor puro ou grandezas CC; usar corrente eficaz em CA.', 'Três cabos de fase com I=50 A e R=0,28 Ω cada: P=3·50²·0,28=2,1 kW.', 'Calcular perda de uma fase e confundir com o total.', ['ADV-004']),
    f('f-kcl', 'EE06', 'Lei dos nós de Kirchhoff', 'Σ I_entrando = Σ I_saindo', ['I: correntes algébricas (A)'], 'Escrever equações nodais para circuitos.', 'Escolher convenção de sentidos e aplicá-la de forma consistente.', 'Entram 4 A e 7 A; saem 6 A e I: I=4+7−6=5 A.', 'Ignorar sinal algébrico de corrente.', ['AUT-022']),

const ADDITIONAL_MASTERCLASSES = [
    c('trafo-ideal', ['Analisar a relação de transformação e suas hipóteses.', 'Calcular potência de carga, correntes de linha e rendimento de transformador trifásico.', 'Separar queda de tensão, perdas, magnetização e transitório de energização.'], [
        { title: '1. Transformador real não é apenas uma proporção de espiras', explanation: [
                'O transformador transfere potência por acoplamento magnético entre enrolamentos, mantendo a frequência da fonte. No modelo ideal, V1/V2=N1/N2 e as correntes seguem a relação inversa. Esse modelo é ponto de partida para compreender tensões de placas, mas não reproduz perdas nem queda sob carga.',
                'Na máquina real, resistência dos enrolamentos gera perdas de cobre, enquanto o núcleo apresenta perdas por histerese e correntes parasitas. A reatância de dispersão representa fluxo que não concatena integralmente ambos os enrolamentos. A corrente de magnetização existe mesmo sem carga.',
                'Não confunda potência aparente nominal em kVA com potência ativa útil em kW: o fator de potência da carga determina a parcela ativa. Para circuitos trifásicos equilibrados, S=√3 V_linha I_linha.'
            ], equations: ['V1/V2≈N1/N2 (modelo ideal)', 'S3φ=√3·V_L·I_L', 'η=P_saida/P_entrada'], question: 'Se um trafo possui placa de 500 kVA, é correto afirmar que ele entrega 500 kW em qualquer condição?', answer: 'Não. kVA é potência aparente; P depende do fator de potência da carga. Também existem limites térmicos, de temperatura, tensão, condições de instalação e perdas.' },
        { title: '2. Exemplo integrado: carregamento e eficiência', explanation: [
                'Um transformador trifásico de 500 kVA, 13,8 kV/380 V, alimenta carga equilibrada equivalente a 80% de sua potência aparente nominal, com fator de potência 0,85. As perdas totais no ponto considerado são de 8 kW. Considere regime permanente e tensões terminais próximas das nominais.',
                'Primeiro converta a porcentagem de carga em kVA. Depois encontre kW útil, corrente de linha e rendimento. Os 8 kW de perda precisam ser adicionados à saída, não subtraídos do valor de entrada ainda desconhecido.'
            ], steps: [
                'Saída aparente: S2=0,80·500=400 kVA.',

                'Corrente no secundário: I2=400000/(√3·380)≈607,7 A.',

            ], question: 'Por que não calculamos rendimento como 340/400?', answer: 'Porque 400 kVA é potência aparente, enquanto rendimento é a razão entre potências ativas de saída e entrada, em kW.' },
        { title: '3. O que muda no comissionamento e na proteção', explanation: [
                'O teste de relação de transformação, resistência de enrolamento e isolação revela condições distintas. A regulação de tensão está associada à impedância interna e ao fator de potência da carga; não é uma variação puramente geométrica de espiras.',
                'Na energização pode ocorrer corrente transitória de magnetização elevada (inrush), com assimetrias e conteúdo harmônico. Não trate todo pico inicial de corrente como curto-circuito, mas também não dispense análise de proteção diferencial e de restrição harmônica.',
                'Em transformadores de potência, a função de proteção e a interpretação de ensaios devem considerar normas, esquema de ligação, grupos vetoriais, TC, ajustes e recomendações do fabricante.'
            ], question: 'Uma diferença de relação nominal explica sozinha aquecimento anormal e vibração?', answer: 'Não. Devem ser investigados carregamento, ventilação, resistência, perdas, núcleo, conexões e condições do sistema.' }
    ], ['Separar kVA, kW e perdas é indispensável.', 'O modelo ideal não prevê regulação, perdas ou energização.', 'Ensaios diferentes avaliam grandezas e defeitos diferentes.']),
    c('magnetismo', ['Calcular fluxo e fem induzida sem confundir ângulos geométricos.', 'Relacionar saturação, núcleo e perdas em conversores eletromagnéticos.', 'Aplicar Faraday e Lenz em estimativa de transformador.'], [
        { title: '1. Fluxo, campo e orientação', explanation: [
                'O fluxo magnético é a integral da densidade de fluxo B através da superfície, com produto escalar B·dA. Para campo uniforme e superfície plana, Φ=B A cosθ, em que θ é medido entre B e a normal da superfície, não necessariamente entre B e o próprio plano.',
                'A lei de Faraday relaciona tensão induzida à taxa de variação do fluxo concatenado: e=−N dΦ/dt. O sinal negativo corresponde à lei de Lenz e reflete oposição à variação que gerou a fem.',
                'Usar B em teslas, área em m² e Φ em webers permite verificar dimensão. Fluxo elevado em núcleo com material não linear pode aproximá-lo da saturação; isso eleva corrente magnetizante e perdas.'
            ], equations: ['Φ=∫B·dA', 'Φ=BAcosθ (campo uniforme)', 'e=−N·dΦ/dt'], question: 'Um plano paralelo ao campo B apresenta fluxo máximo?', answer: 'Não. Se B é paralelo ao plano, o ângulo com a normal é 90°, portanto o fluxo ideal é zero.' },
        { title: '2. Exemplo: tensão eficaz de uma bobina', explanation: [
                'Considere uma bobina de 100 espiras submetida a fluxo senoidal Φ(t)=Φmax·sen(2πft), com Φmax=8 mWb por espira e frequência de 50 Hz. Admita espiras idênticas e acoplamento uniforme.',
                'Derive a expressão temporal e passe de pico para RMS. A relação 4,44fNΦmax pressupõe fluxo sinusoidal, não é equação universal para qualquer forma de onda.'
            ], steps: [
                'Converta o fluxo máximo: 8 mWb=0,008 Wb.',
                'Derive Φ(t): dΦ/dt=2πfΦmax·cos(2πft).',
                'Pico da fem: E_pico=2π·50·100·0,008≈251,3 V.',
                'Valor eficaz de senoide: E_RMS=E_pico/√2≈177,7 V.',
                'Conferência com a expressão usual: 4,44·50·100·0,008≈177,6 V.',
                'O pequeno desvio é arredondamento do fator 4,44, aproximação de 2π/√2.'
            ], question: 'Se a frequência dobrar e Φmax permanecer igual, o que acontece à tensão induzida eficaz no modelo?', answer: 'Dobra, pois E∝fNΦmax. Em uma máquina real, manter o mesmo fluxo também depende da fonte e das condições de operação.' },
        { title: '3. Saturação, entreferro e projeto', explanation: [
                'A curva B-H de um material ferromagnético não é linear em toda a faixa. Próximo à saturação, aumentar a intensidade H produz incrementos menores de B, enquanto corrente e perdas podem crescer fortemente.',
                'O entreferro aumenta a relutância do caminho magnético, podendo melhorar linearidade e capacidade de armazenar energia em certos dispositivos, porém altera a corrente magnetizante necessária.',
                'Dimensionar um transformador ou indutor exige observar frequência, perdas no núcleo, perdas Joule, temperatura, isolamento e forma de onda aplicada, não apenas escolher uma área e multiplicar por B.'
            ], question: 'Por que tensão contínua aplicada ao primário de trafo convencional não produz transferência sustentada por indução?', answer: 'Fluxo constante não gera fem de transformação no secundário; corrente de magnetização do primário pode crescer e provocar aquecimento por saturação e resistência do enrolamento.' }
    ], ['Faraday vincula tensão à variação temporal do fluxo.', 'O ângulo da área é medido com sua normal.', 'Saturação e perdas limitam o modelo ideal.']),
    c('seguranca', ['Distinguir funções do disjuntor, fusível e DR.', 'Relacionar corrente de falta e impedância do laço à atuação de proteção.', 'Identificar limites normativos de métodos simplificados.'], [
        { title: '1. Proteções não são intercambiáveis', explanation: [
                'O disjuntor termomagnético pode atuar em sobrecarga e em curto-circuito conforme sua curva e capacidades nominais. O fusível interrompe por aquecimento do elemento conforme suas características temporais. O DR monitora desequilíbrio de correntes que atravessam seu núcleo sensor.',
                'O DR não detecta necessariamente uma sobrecorrente equilibrada de ida e retorno. Por isso, DR puro não substitui proteção contra sobrecarga ou curto-circuito, a menos que seja um dispositivo combinado projetado para ambas as funções.',
                'Proteção contra contatos, seccionamento, aterramento e equipotencialização dependem do esquema de aterramento e da norma aplicável. Não escolha correntes nominais e tempos apenas pela sensibilidade do DR.'
            ], question: 'Um DR de 30 mA funciona como disjuntor de 30 mA para sobrecarga?', answer: 'Não. 30 mA é a corrente diferencial residual nominal de atuação; sobrecorrente exige dispositivo próprio ou combinado.' },
        { title: '2. Estudo simplificado: impedância de laço de falta', explanation: [
                'Em um circuito de baixa tensão com tensão fase-terra de 230 V e impedância total do laço de falta de 0,50 Ω, suponha falta fase-PE franca e fonte ideal representada pela impedância fornecida.',
                'Essa conta estima a corrente de falta, mas não confirma automaticamente o tempo de desligamento: deve-se comparar à característica do dispositivo e às exigências do esquema de proteção aplicável.'
            ], steps: [
                'Tensão de referência U0=230 V (fase-terra).',
                'Impedância de laço Zs=0,50 Ω, incluindo percurso completo do circuito de falta na hipótese simplificada.',
                'Corrente presumida Ia≈U0/Zs=230/0,50=460 A.',
                'Confronte os 460 A com a curva tempo-corrente do dispositivo de proteção realmente instalado.',
                'Verifique também poder de interrupção, capacidade dos condutores de proteção e energia passante, além das condições de aterramento.'
            ], equations: ['I_falta≈U0/Z_s (modelo de laço simplificado)'], question: '460 A garantem desligamento instantâneo de qualquer disjuntor?', answer: 'Não. Tempo depende de curva, corrente nominal, dispositivo específico e tolerâncias; além disso o estudo deve respeitar o esquema de aterramento.' },
        { title: '3. Qualidade do projeto e inspeção', explanation: [
                'Uma proteção pode existir fisicamente e ainda ser inadequada por seletividade, ligação, corrente residual, curva ou posição. Inspeção inclui verificação de continuidade PE, equipotencialização, testes conforme procedimento e documentação.',
                'Em circuitos com inversores e componentes eletrônicos, correntes residuais com componentes contínuas ou altas frequências podem exigir tipos adequados de DR; a escolha não deve ser reduzida apenas à corrente em mA.',
                'Uma regra memorizada não substitui documentação técnica, normas e avaliação do risco. A integridade do procedimento de inspeção é tão importante quanto o cálculo.'
            ], question: 'Qual condição pode tornar um teste positivo de DR insuficiente para aprovar a instalação?', answer: 'Ausência de verificação de continuidade do condutor de proteção, ligação incorreta, curva incompatível, corrente residual com formas de onda inadequadas ou descumprimento de critérios normativos.' }
    ], ['DR, disjuntor e fusível atuam sobre fenômenos distintos.', 'Corrente presumida não define sozinha tempo de desligamento.', 'Projeto seguro exige conjunto de proteções e ensaios.']),
    c('clima', ['Distinguir mitigação e adaptação em sistemas elétricos.', 'Estimar emissões evitadas sem confundir energia e potência.', 'Avaliar limites de análise socioambiental.'], [
        { title: '1. Avaliação técnica e compromisso social', explanation: [
                'Mitigação climática atua na redução de emissões e no aumento de remoções de gases de efeito estufa. Adaptação reduz exposição, vulnerabilidade e danos frente a impactos climáticos. Uma usina solar pode contribuir para mitigação, enquanto obras de drenagem de acesso e alerta de enchentes são exemplos de adaptação.',
                'Projetos de engenharia devem considerar distribuição de benefícios e riscos: quem acessa energia, quem sofre impactos de obras, custos sociais e condições de segurança. Energia renovável não é automaticamente livre de impactos ambientais.',
                'Indicadores climáticos devem declarar fronteira do sistema, período, fonte do fator de emissão, metodologia de ciclo de vida e cenário de comparação. Uma tonelada de CO2e representa equivalência climática sob método específico.'
            ], question: 'Melhorar drenagem de acesso de usina tem o mesmo mecanismo climático que substituir geração térmica fóssil?', answer: 'Não. A drenagem reduz vulnerabilidade aos impactos (adaptação), enquanto substituir geração emissora pode diminuir emissões (mitigação).' },
        { title: '2. Exemplo comparativo de emissões — valores hipotéticos', explanation: [
                'Considere um projeto que fornece 1,2 GWh por ano. Em estudo preliminar hipotético, o cenário substituído foi atribuído ao fator 0,50 tCO2e/MWh e o novo cenário a 0,10 tCO2e/MWh. Estes valores são hipóteses didáticas, NÃO fatores atuais oficiais do Brasil.',
                'Calcule as emissões diferenciais, mas não declare automaticamente que toda geração nova evita a mesma quantidade: despacho, adicionalidade, perdas, horários e fronteiras de ciclo de vida podem alterar o saldo real.'
            ], steps: [
                'Converta energia: 1,2 GWh/ano=1200 MWh/ano.',
                'Emissões do cenário de referência: 1200·0,50=600 tCO2e/ano.',
                'Emissões do cenário alternativo: 1200·0,10=120 tCO2e/ano.',
                'Diferença estimada: 600−120=480 tCO2e/ano nas hipóteses adotadas.',
                'Para projeto real, valide fatores de emissão, ciclo de vida, sazonalidade e comparabilidade dos cenários.'
            ], question: 'A diferença de 480 tCO2e/ano pode ser anunciada como crédito de carbono automaticamente?', answer: 'Não. Créditos exigem metodologias específicas, requisitos adicionais, verificação e rastreabilidade. Uma estimativa didática não equivale a certificação.' },
        { title: '3. Decisão multidimensional', explanation: [
                'Uma escolha de engenharia pode ser energeticamente eficiente e socialmente inadequada se deslocar populações sem mitigação de impactos, ignorar biodiversidade ou reduzir confiabilidade de abastecimento de comunidades vulneráveis.',
                'Uma avaliação equilibrada considera impactos cumulativos, licenciamento, tecnologias disponíveis, custos do ciclo de vida, segurança operacional e participação das partes afetadas.',
                'Nas questões de Formação Geral, a capacidade de argumentar com evidências e reconhecer diferentes grupos atingidos é tão importante quanto memorizar definições.'
            ], question: 'Como evitar uma decisão baseada apenas em redução percentual de emissões?', answer: 'Comparar impactos sociais, ambientais, econômicos e de confiabilidade, com fontes, unidades, cenários transparentes e regras de participação adequadas.' }
    ], ['Mitigação trata causas; adaptação enfrenta efeitos.', 'Fatores de emissão precisam de fonte e contexto.', 'A análise técnica deve incorporar consequências sociais.'], ['https://www.ipcc.ch/report/ar6/wg2/', 'https://www.gov.br/inep/pt-br/centrais-de-conteudo/legislacao/enade']),
    c('bayes-confiabilidade', ['Usar análise de taxa-base para alarmes raros.', 'Distinguir disponibilidade, confiabilidade e mantenabilidade.', 'Calcular disponibilidade simples sob hipóteses estacionárias.'], [
        { title: '1. Diagnóstico não é previsão sem contexto', explanation: [
                'Probabilidade de alarme dado falha (sensibilidade) é diferente de probabilidade de falha dado alarme (valor preditivo positivo). Bayes combina sensibilidade, taxa de falsos positivos e prevalência anterior.',
                'Em manutenção preditiva, falsos positivos podem induzir paradas e gastos, enquanto falsos negativos deixam defeitos sem investigação. O limiar de decisão deve considerar custo, risco e consequência de cada erro.',
                'Se duas inspeções usam o mesmo sensor e mesmo algoritmo, resultados podem estar correlacionados. Não multiplique suas probabilidades como se as evidências fossem independentes sem justificar essa hipótese.'
            ], equations: ['P(F|A)=P(A|F)P(F)/P(A)'], question: 'Sensibilidade de 95% implica 95% de chance de defeito após alarme?', answer: 'Não. É necessário conhecer a prevalência de falha e os falsos positivos.' },
        { title: '2. Disponibilidade de equipamento reparável', explanation: [
                'Sob hipótese de tempos médios representativos, regime estacionário simplificado e ciclos de falha/reparo, a disponibilidade inerente aproxima-se por A=MTBF/(MTBF+MTTR). Isso não equivale à confiabilidade R(t), que descreve a probabilidade de sobreviver sem falha por um intervalo.',
                'Considere equipamento com tempo médio entre falhas MTBF=1000 h e tempo médio de reparo MTTR=10 h. Desconsidere logística e indisponibilidade planejada no modelo.'
            ], steps: [
                'Some tempos médios de ciclo: 1000+10=1010 h.',
                'Disponibilidade A=1000/1010≈0,990099.',
                'Em percentual: A≈99,01%.',
                'Indisponibilidade complementar U=1−A≈0,009901=0,99%.',
                'Não conclua que o equipamento possui confiabilidade de 99,01% em 1000 h: é uma medida distinta de tempo médio operacional.'
            ], question: 'Uma máquina com disponibilidade de 99% necessariamente trabalha 99% de cada dia?', answer: 'Não. O valor é uma aproximação média de longo prazo; falhas podem concentrar indisponibilidade em determinados períodos.' },
        { title: '3. Dados e decisão operacional', explanation: [
                'Em usinas e sistemas industriais, a disponibilidade medida depende de como se classificam paradas programadas, indisponibilidades forçadas, tempo de espera e manutenção. Denominadores diferentes produzem indicadores diferentes.',
                'Uma ação preventiva pode reduzir MTTR por preparação de sobressalentes, ou aumentar MTBF por correção de causa raiz. Deve-se avaliar custo, confiabilidade de dados e criticidade do ativo.',
                'Séries muito curtas e eventos de falha raros tornam médias instáveis; intervalos de confiança e mecanismos físicos de falha são essenciais para conclusões robustas.'
            ], question: 'Apenas acrescentar mais inspeções garante maior disponibilidade?', answer: 'Não. Deve-se avaliar se a inspeção detecta causas relevantes, o custo e tempo de parada e o efeito real sobre falhas e reparos.' }
    ], ['Bayes requer probabilidade prévia.', 'Disponibilidade não equivale a confiabilidade em um intervalo.', 'Indicadores dependem de definições e qualidade dos registros.']),
    c('votacao-protecao', ['Derivar lógica 2oo3 por álgebra booleana.', 'Comparar segurança de atuação e risco de disparo falso.', 'Reconhecer limitações das hipóteses probabilísticas.'], [
        { title: '1. Lógica majoritária e tabela verdade', explanation: [
                'A lógica 2oo3 (two out of three) atua quando pelo menos dois dos sinais A, B e C estão ativos. A forma booleana simplificada é Y=AB+AC+BC. Cada produto representa um par suficiente; a soma lógica representa a união de condições.',
                'Os oito estados possíveis de três entradas incluem quatro com pelo menos dois sinais verdadeiros: 011, 101, 110 e 111. As outras quatro combinações não geram comando.',
                'A redundância pode aumentar tolerância a uma falha de sensor, mas não elimina problemas de alimentação compartilhada, calibração idêntica incorreta ou erro no software de decisão.'
            ], equations: ['Y=AB+AC+BC', 'Y=1 se A+B+C≥2 (soma aritmética de bits)'], question: 'A lógica 2oo3 exige os três sinais ao mesmo tempo?', answer: 'Não. Dois sinais ativos já são suficientes; três ativos também atendem.' },
        { title: '2. Exemplo quantitativo de confiabilidade e falso disparo', explanation: [
                'Admita três sensores independentes, probabilidade de detectar corretamente a condição de p=0,95 e probabilidade de falso positivo q=0,02 quando a condição não existe. Suponha lógica sem falha e ausência de causa comum.',
                'O cálculo de sucesso em presença de evento e o de disparo falso em ausência de evento são problemas diferentes, usando probabilidades condicionadas a estados físicos distintos.'
            ], steps: [
                'P(atuação correta | evento)=P(exatamente 2)+P(3)=3p²(1−p)+p³.',
                'Para p=0,95, P=3·0,95²·0,05+0,95³=0,99275=99,275%.',
                'P(disparo indevido | sem evento)=3q²(1−q)+q³.',

                'Em percentual, falso disparo≈0,1184% por oportunidade sob as hipóteses adotadas.',
                'Compare às arquiteturas 1oo3 e 3oo3 conforme exigência de segurança funcional: os compromissos não são equivalentes.'

        { title: '3. Validação da lógica', explanation: [

    c('adc-calibracao', ['Distinguir quantidade de códigos de erro total de medição.', 'Interpretar resolução quantizada e incerteza de referência.', 'Verificar filtro, saturação e interferências.'], [
        { title: '1. ADC ideal e mundo real', explanation: [
                'Um ADC de n bits divide a faixa analógica em 2ⁿ códigos digitais. Uma aproximação para a largura do intervalo ideal é LSB=(Vmax−Vmin)/2ⁿ. Esse passo não é garantia de exatidão, pois offsets, erro de ganho, não linearidades, ruído e referências afetam a conversão.',
                'Amostragem temporal e quantização em amplitude são processos diferentes. Um ADC com muitos bits pode sofrer aliasing se o filtro de entrada e a taxa de amostragem forem inadequados.',

            ], equations: ['N=2ⁿ códigos', 'LSB≈(Vmax−Vmin)/2ⁿ'], question: 'Um ADC de 16 bits elimina necessidade de filtro anti-aliasing?', answer: 'Não. Bits aumentam resolução nominal de amplitude; o filtro limita frequências antes da amostragem.' },
        { title: '2. Estudo de medição de 0 a 10 V', explanation: [

                'Passo ideal: LSB≈10/4096=0,0024414 V=2,441 mV.',
                'Erro máximo de escala informado: 0,1%·10 V=0,001·10=0,010 V=10 mV.',
                'Compare as grandezas: 10 mV é aproximadamente 4,10 LSB.',

        { title: '3. Aquisição aplicada a sensores', explanation: [

    ], ['Resolução não garante exatidão.', 'Erro informado e LSB precisam ser convertidos para a mesma unidade.', 'Toda cadeia analógica e digital influencia a medição.']),
    c('solar-estimativa', ['Estimar energia fotovoltaica a partir de HSP e PR.', 'Separar potência nominal, geração média e despacho instantâneo.', 'Reconhecer perdas por temperatura, sombreamento e indisponibilidade.'], [
        { title: '1. Potência não é energia', explanation: [

                'Horas de sol pleno (HSP) representam insolação diária equivalente à irradiância de referência. O índice de desempenho PR incorpora perdas sistêmicas como temperatura, conversão, sujeira e disponibilidade, conforme convenção do estudo.',

        { title: '2. Estimativa de geração e média anual', explanation: [

    ], ['kWp e kWh não são intercambiáveis.', 'HSP e PR são hipóteses explícitas que precisam de fonte.', 'A estimativa é preliminar, não garantia contratual.']),
    c('economia-projeto', ['Calcular payback e VPL com fluxos líquidos coerentes.', 'Compreender taxa de desconto e valor temporal do dinheiro.', 'Avaliar decisões além do custo inicial.'], [
        { title: '1. Diferença entre caixa, resultado e valor presente', explanation: [

                'O valor presente líquido (VPL) traz cada fluxo futuro ao valor de hoje por uma taxa de desconto compatível com o período e o risco considerado. VPL positivo sugere criação de valor nas hipóteses, mas não elimina incerteza nem substitui a avaliação técnica.',

    c('estabilidade-polos', ['Interpretar raízes características e estabilidade LTI.', 'Aplicar Routh-Hurwitz em polinômios simples.', 'Separar estabilidade do modelo e desempenho físico real.'], [
        { title: '1. Polos são modos dinâmicos', explanation: [

                'Quando o modelo tem zeros, saturação, atraso ou polos não observáveis, a interpretação apenas pela função de transferência reduzida pode omitir dinâmicas internas. A estabilidade exige conhecer a realização do sistema e o contexto da análise.',

                'Para polinômio cúbico a3 s³+a2 s²+a1 s+a0, com coeficientes positivos, condição necessária e suficiente de estabilidade estrita é a2·a1>a3·a0.'

        { title: '3. Relação com ajustes reais', explanation: [

    c('tcs-protecao', ['Calcular relação nominal de TC sem ignorar classe de proteção.', 'Relacionar burden e saturação durante faltas.', 'Conhecer riscos de circuito secundário aberto.'], [

                'As leis de Kirchhoff decorrem de conservação de carga (soma algébrica das correntes em um nó igual a zero) e de energia no modelo concentrado (soma algébrica das tensões em uma malha igual a zero). A primeira não depende de o circuito estar série ou paralelo; a segunda exige respeitar polaridades.',
                'Não assuma que dois resistores estão em paralelo apenas porque foram desenhados próximos. Eles precisam compartilhar os mesmos dois nós. Em circuitos com fontes dependentes ou mais de um nó essencial, a análise nodal costuma ser mais segura que combinações intuitivas de resistências.'

        { title: '2. Caso de engenharia: rede resistiva com duas fontes', explanation: [

        { title: '3. Conferência independente: balanço de potência', explanation: [

        { title: '4. Generalização útil para a prova', explanation: [
                'Com fontes dependentes, mantenha a variável de controle na equação da fonte. Para calcular resistência de Thévenin, não desative fontes dependentes; use uma fonte-teste ou outra estratégia adequada.',
                'Em CA senoidal, substitua R por impedâncias complexas Z_R=R, Z_L=jωL, Z_C=1/(jωC). A estrutura de Kirchhoff continua válida para fasores, mas a potência precisa ser tratada como complexa S=P+jQ.',
                'Em transitórios, condições iniciais importam: v_C(0+) = v_C(0−) e i_L(0+) = i_L(0−) em modelos ideais sem impulsos. Não se transfere um resultado de CC diretamente para o instante inicial sem verificar elementos armazenadores.'
            ], equations: ['Z_L=jωL ; Z_C=1/(jωC)', 'S=V·I* = P+jQ'], question: 'Ao analisar uma rede com fontes dependentes e senoides, basta desativar todas as fontes para obter a resistência de Thévenin?', answer: 'Não. Fontes dependentes permanecem no modelo, e em regime senoidal devemos trabalhar com impedâncias complexas e fontes-teste quando necessário.' }
    ], ['Desenhe os nós e sentidos de corrente antes de calcular.', 'Equações e conservação de potência devem concordar.', 'Cuidado ao transitar entre CC, fasores e transitórios.'], ['https://openstax.org/books/university-physics-volume-2/pages/10-3-kirchhoffs-rules', ...base]),
    C('potencia-trifasica', 60, [
        'Distinguir potência ativa, reativa e aparente em sistemas equilibrados.',

        'Relacionar corrente de linha, perdas e limitações de sistemas reais.'
    ], [
        { title: '1. O que circula em uma instalação trifásica', explanation: [
                'Em regime senoidal equilibrado, as três fases fornecem potências com deslocamento de 120°. Para calcular a potência total com grandezas de linha, use √3V_LI_L. Potência ativa P é a transferência média de energia útil e perdas; Q representa a troca de energia com campos armazenadores; S é o módulo da potência complexa.',
                'Fator de potência é a razão P/S em regime mais geral. O uso cosφ coincide com P/S apenas para formas de onda senoidais adequadas. Em sistemas distorcidos, o fator de potência total também depende de harmônicos e não pode ser reduzido sempre ao ângulo de deslocamento.',
                'Um banco capacitivo ideal pode reduzir a componente indutiva fundamental de Q, mas não corrige automaticamente distorções e pode causar ressonância com indutâncias da rede. A compensação deve partir de medições e estudo de qualidade de energia.'
            ], equations: ['S=√(P²+Q²)', 'P=√3·V_L·I_L·cosφ', 'Q=P·tanφ (senoidal)', 'Q_C=P·[tan(arccos FP_i)−tan(arccos FP_f)]'], question: 'Para a mesma potência ativa e tensão, o que acontece à corrente quando o fator de potência melhora?', answer: 'Em sistema trifásico senoidal equilibrado, I=P/(√3V_LFP), logo a corrente diminui. Não significa que o consumo ativo da carga diminuiu na mesma proporção.' },
        { title: '2. Estudo aplicado: compensação e perdas', explanation: [
                'Uma instalação de 400 V entre linhas absorve 230 kW de potência ativa com FP de deslocamento inicial 0,76 indutivo. O objetivo é FP de 0,96, mantendo P constante. Admita regime trifásico senoidal equilibrado e perdas do banco desprezíveis.',
                'Não dimensione o banco simplesmente multiplicando P pela diferença entre fatores de potência. A grandeza a compensar é a diferença de potências reativas, em kvar.',
                'O resultado nominal é ponto de partida. Na prática, mudanças do perfil de carga, degraus de controle, harmônicos, tolerâncias e sob/ sobretensões podem alterar a solução.'
            ], steps: [
                'Ângulo inicial: tanφ_i=√(1−0,76²)/0,76≈0,8554; Q_i≈230·0,8554=196,7 kvar.',
                'Ângulo desejado: tanφ_f=√(1−0,96²)/0,96≈0,29167; Q_f≈230·0,29167=67,1 kvar.',
                'Potência capacitiva fundamental aproximada: Q_C=196,7−67,1≈129,6 kvar.',
                'Corrente inicial: I_i=230000/(√3·400·0,76)≈436,8 A. Corrente final: I_f=230000/(√3·400·0,96)≈345,8 A.',
                'Se a resistência do mesmo alimentador e sua temperatura fossem mantidas, a razão aproximada das perdas I²R seria (345,8/436,8)²≈0,627: redução ideal de 37,3% nessa parcela das perdas.',
                'Isso não significa redução de 37,3% na energia total da fábrica: o motor/ processo continua exigindo aproximadamente a mesma potência ativa; as perdas são apenas uma fração do consumo.'
            ], equations: ['I=P/(√3·V_L·FP)', 'P_Joule=3I²R_fase'], question: 'Por que 129,6 kvar não deve ser confundido com 129,6 kW?', answer: 'A potência reativa é medida em var; ela representa intercâmbio de energia em campos elétricos/magnéticos, não transferência média de trabalho como os watts.' },
        { title: '3. Compensação com segurança técnica', explanation: [
                'Antes de instalar capacitores, avalie o espectro de corrente e tensão, o nível de curto-circuito, a potência reativa já presente e a possibilidade de sobrecompensação em cargas leves.',
                'Em sistemas com inversores e retificadores, o banco pode criar ressonância paralela com a impedância da alimentação. Nesses casos, bancos dessintonizados ou filtros podem ser necessários; não existe dimensionamento seguro por uma única fórmula.',

            ], question: 'É correto concluir que fator de potência de deslocamento igual a 1 significa ausência de harmônicos?', answer: 'Não. O deslocamento pode ser nulo na fundamental e ainda haver distorção significativa da corrente, reduzindo o fator de potência total.' }
    ], ['Use grandezas de linha coerentes com potência trifásica total.', 'Compensação requer diferença de Q, não diferença direta entre FP.', 'Energia ativa, perdas I²R e qualidade de energia são conceitos relacionados, mas distintos.'], ['https://openstax.org/books/university-physics-volume-2/pages/15-5-power-in-an-ac-circuit', ...base]),
    C('curto-circuito-pu', 65, [
        'Converter impedâncias para uma base comum antes de somá-las.',
        'Calcular uma corrente de falta trifásica simplificada e interpretar limites do modelo.',
        'Associar resultados aos requisitos de capacidade de interrupção e ajustes de proteção.'
    ], [
        { title: '1. De onde nasce a corrente de curto-circuito', explanation: [
                'Uma falta modifica drasticamente a topologia elétrica e pode criar um caminho de impedância baixa. Para falta trifásica equilibrada em um sistema idealizado, usa-se a rede de sequência positiva até o ponto da falta. Os equivalentes de Thévenin representam fontes e impedâncias a montante.',
                'A representação por unidade (pu) permite comparar impedâncias de componentes com tensões nominais diferentes, desde que todas sejam expressas em bases compatíveis. Potências-base são trifásicas; tensões-base costumam ser entre linhas.',
                'Não some uma impedância de transformador em 20 MVA a outra de cabo em 10 MVA como se compartilhassem a mesma base. O resultado final poderia parecer plausível e estar significativamente errado.'
            ], equations: ['I_base=S_base/(√3·V_L,base)', 'Z_base=V_L,base²/S_base', 'Z_pu,nova=Z_pu,antiga·(S_base,nova/S_base,antiga)·(V_base,antiga/V_base,nova)²', 'I_falta,pu≈V_pre,pu/Z_Th,pu'], question: 'Por que um trafo de 20 MVA em 13,8 kV não implica curto-circuito de 20 MVA?', answer: 'A potência nominal é capacidade de carga de regime, enquanto a corrente de falta depende das impedâncias equivalentes e da contribuição das fontes.' },
        { title: '2. Estudo resolvido em diferentes bases', explanation: [
                'Considere no barramento de 13,8 kV um equivalente fonte com reatância j0,08 pu na base 20 MVA, transformador série j0,12 pu na mesma base e trecho de alimentador com j0,03 pu declarado na base 10 MVA e mesma tensão-base.',
                'Admita tensão pré-falta 1 pu, fonte ideal por trás da reatância, resistência desprezível, ausência de outras fontes e falta trifásica franca nos terminais. Este modelo não fornece correntes assimétricas de pico nem atende sozinho a estudos normativos completos.'
            ], steps: [
                'Escolha base comum de 20 MVA e 13,8 kV. Como a tensão-base é a mesma, converta a reatância do alimentador: X_c=0,03·(20/10)=0,06 pu.',
                'Some as reatâncias série até a falta: X_Th=0,08+0,12+0,06=0,26 pu.',
                'Corrente-base: I_b=20.000.000/(√3·13.800)≈836,7 A.',

            ], equations: ['X_Th,pu=0,26', 'I_f≈3,22 kA'], question: 'Se esquecermos a conversão do alimentador, qual o tipo de erro esperado?', answer: 'A reatância seria subestimada (0,03 no lugar de 0,06 pu), levando a uma corrente de curto-circuito artificialmente maior.' },
        { title: '3. Relação com seletividade e proteção', explanation: [
                'Uma corrente de falta calculada não representa diretamente o ajuste correto do relé. Seletividade, sensibilidade, saturação de transformadores de corrente, tempos de atuação, partidas de motor e coordenação com dispositivos a jusante precisam ser analisados.',
                'Para especificar poder de interrupção, avalie o método normativo aplicável, a contribuição de motores e fontes distribuídas, o comportamento subtransitório, a componente contínua e as margens de projeto.',
                'Cargas e usinas são dinâmicas. Um único cálculo simplificado não substitui estudo de proteção, nem autoriza a operação ou a energização de equipamentos.'
            ], question: 'Corrente de curto-circuito calculada e corrente nominal do disjuntor são a mesma especificação?', answer: 'Não. Corrente nominal refere-se à condução contínua; capacidade de interrupção e fechamento/ suportabilidade respondem a solicitações de falta e devem obedecer ao contexto normativo.' }
    ], ['Impedâncias devem compartilhar base de potência e tensão antes da soma.', 'A conta de sequência positiva serve à falta trifásica equilibrada do modelo.', 'Proteção exige mais que comparar corrente de falta a um número nominal.'], base),
    C('maquina-inducao', 55, [

        'Relacionar balanço de potência, perdas e torque útil.',
        'Distinguir operação real, nominal e partida.'
    ], [
        { title: '1. Campo girante e produção de torque', explanation: [
                'Correntes trifásicas equilibradas no estator criam um campo magnético girante à velocidade síncrona n_s. O rotor é induzido pela velocidade relativa entre condutores e campo. Em regime motor, o rotor costuma girar ligeiramente abaixo de n_s para que exista indução e torque.',
                'O escorregamento s=(n_s−n)/n_s é adimensional; em regime motor normal é positivo e pequeno. A frequência elétrica rotórica no modelo ideal é s·f. Em um motor com quatro polos a 60 Hz, n_s=1800 rpm; número de pares de polos não deve substituir o número total na fórmula 120f/p.',
                'Torque na saída é potência mecânica útil dividida pela velocidade angular. Torque interno e torque útil diferem pelas perdas mecânicas e adicionais.'
            ], equations: ['n_s=120f/p (rpm, p=polos)', 's=(n_s−n)/n_s', 'f_rotor=s·f', 'T_eixo=P_eixo/ω; ω=2πn/60'], question: 'O rotor de um motor de indução idealmente gira exatamente à velocidade síncrona sob carga?', answer: 'Não. Com escorregamento zero, não haveria frequência relativa no rotor nem torque eletromagnético em um motor de indução convencional.' },
        { title: '2. Caso integrado: potência, perdas e torque', explanation: [
                'Um motor trifásico de seis polos alimentado a 60 Hz opera a 1164 rpm. Recebe 90 kW elétricos e entrega 81 kW úteis no eixo. Considere regime permanente e os valores declarados simultâneos.',
                'A questão exige separar três grandezas: velocidade síncrona, rendimento e torque. Sem a potência mecânica de saída não é correto usar diretamente os 90 kW de entrada para calcular torque útil.'
            ], steps: [
                'Velocidade síncrona: n_s=120·60/6=1200 rpm.',
                'Escorregamento: s=(1200−1164)/1200=0,03, ou 3%. Frequência rotórica aproximada: 0,03·60=1,8 Hz.',
                'Rendimento: η=P_eixo/P_entrada=81/90=0,90 ou 90%. Perdas totais: 90−81=9 kW.',
                'Velocidade angular do eixo: ω=2π·1164/60≈121,89 rad/s.',
                'Torque útil: T=81000/121,89≈664,5 N·m.',
                'Esse torque não determina, sozinho, a corrente de partida, o conjugado máximo, a eficiência em outros pontos nem a classe de isolação.'
            ], question: 'Por que a perda total de 9 kW não é necessariamente igual à perda de cobre do rotor?', answer: 'Inclui perdas no estator, ferro, rotor, atrito, ventilação e adicionais, dependendo do balanço. O cobre do rotor está ligado ao escorregamento e à potência de entreferro, não diretamente à diferença total.' },
        { title: '3. Balanço energético interno', explanation: [
                'Após descontar perdas elétricas e magnéticas do estator, a potência cruza o entreferro P_ag. Uma parcela s·P_ag é dissipada no rotor e a parcela (1−s)·P_ag é convertida eletromecanicamente. As perdas mecânicas ainda devem ser subtraídas para obter a potência no eixo.',
                'Durante partida direta, escorregamento próximo de 1 e correntes elevadas exigem análise da rede e da máquina. Estratégias com inversores, soft-starters e autotransformadores têm implicações diferentes de torque, harmônicos e controle.',
                'Na engenharia de manutenção, verifique tensão desequilibrada, corrente de fase, aquecimento, vibração e histórico de carga antes de atribuir qualquer anomalia apenas ao escorregamento.'
            ], equations: ['P_cobre,rotor=s·P_ag', 'P_convertida=(1−s)·P_ag', 'P_eixo=P_convertida−P_mecânicas'], question: 'Se s aumenta e P_ag permanece constante, o que acontece à parcela de perdas ôhmicas do rotor?', answer: 'Ela cresce proporcionalmente a s. Porém, em uma máquina real P_ag e outras variáveis também mudam com o ponto de operação.' }
    ], ['ns depende de frequência e número total de polos.', 'η, P_ag e P_eixo não são intercambiáveis.', 'Definir torque útil exige potência mecânica útil e rotação do eixo.'], base),
    C('transitorios-rlc', 60, [
        'Aplicar continuidade de tensão capacitiva e corrente indutiva.',
        'Derivar resposta RC com condição inicial diferente de zero.',
        'Distinguir resposta subamortecida em RLC e ressonância.'
    ], [
        { title: '1. Memória do circuito e condição inicial', explanation: [
                'Um capacitor ideal armazena energia E_C=½Cv² e um indutor ideal armazena E_L=½Li². Essas grandezas impedem saltos instantâneos de tensão capacitiva e corrente indutiva sem impulsos infinitos no modelo.',
                'Uma chave pode mudar abruptamente a topologia, mas a condição imediatamente após a manobra deve respeitar v_C(0+)=v_C(0−) e i_L(0+)=i_L(0−). Não confunda o estado final com o instante 0+.',
                'Respostas de primeira ordem caminham entre o valor inicial e o final: x(t)=x∞+[x(0+)−x∞]e^(−t/τ). O tempo τ não é tempo para completar 100% do processo.'
            ], equations: ['τ_RC=R_eqC', 'τ_RL=L/R_eq', 'x(t)=x_∞+[x(0+)−x_∞]e^(−t/τ)'], question: 'A tensão de um capacitor ideal inicialmente a 8 V salta para 20 V no instante de fechar a chave?', answer: 'Não. Ela parte de 8 V e tende a 20 V segundo a dinâmica resultante, salvo impulsos idealizados de corrente.' },
        { title: '2. Exemplo RC com tensão inicial', explanation: [
                'Uma fonte de 20 V é conectada, em t=0, a resistor de 4 kΩ em série com capacitor de 220 µF inicialmente carregado a 8 V. Admita componentes lineares ideais, sem outros caminhos de corrente.',
                'A diferença inicial na resistência é 20−8=12 V. A corrente decai à medida que a tensão do capacitor cresce; o sinal da resposta deve refletir isso.'
            ], steps: [
                'Constante de tempo: τ=R·C=4000·220·10⁻⁶=0,88 s.',
                'Resposta: v_C(t)=20+(8−20)e^(−t/0,88)=20−12e^(−t/0,88) volts.',

                'A corrente instantânea é i(t)=[20−v_C(t)]/4000. Em 2τ: i≈1,624/4000=0,406 mA.',
                'A corrente inicial era (20−8)/4000=3 mA, maior que a de 2τ.',
                'Para alcançar 19 V, resolva 20−12e^(−t/0,88)=19; t=0,88·ln12≈2,187 s.'
            ], question: 'Por que 19 V não ocorre em uma constante de tempo?', answer: 'A fração de aproximação ao valor final depende da diferença inicial: após 1τ resta cerca de 36,8% dos 12 V iniciais, ou 4,41 V de desvio, e não apenas 1 V.' },
        { title: '3. Ordem 2: RLC e amortecimento', explanation: [
                'No circuito RLC série sem excitação, a equação característica associada à corrente é s²+(R/L)s+1/(LC)=0. Defina α=R/(2L) e ω0=1/√(LC). Se α<ω0, os polos são complexos conjugados com parte real negativa e há oscilação amortecida.',
                'Em modelos ideais, para L=50 mH, C=20 µF e R=20 Ω, ω0=1/√(0,05·20·10⁻⁶)=1000 rad/s; α=20/(2·0,05)=200 s⁻¹; ωd=√(ω0²−α²)≈979,8 rad/s, isto é cerca de 155,9 Hz.',
                'Essa frequência amortecida não é simplesmente 1/τ, e a presença da fonte e as condições iniciais definem a amplitude e a fase dos transientes. Interpretação de curva exige reconhecer o que está sendo medido.'
            ], equations: ['ω0=1/√(LC)', 'α=R/(2L)', 'ωd=√(ω0²−α²) (quando α<ω0)'], question: 'Um circuito com R muito elevado necessariamente apresenta oscilação?', answer: 'Não. Se α≥ω0 a resposta deixa de ser subamortecida; pode ser criticamente amortecida ou superamortecida.' }
    ], ['Condição inicial é tão importante quanto constante de tempo.', 'Cheque dimensões: RC e L/R devem resultar em segundos.', 'RLC exige observar polos e amortecimento, não apenas uma fórmula de ressonância.'], base),
    C('controle-malha', 60, [

    ], [
        { title: '1. Modelar antes de ajustar', explanation: [
                'Uma função de transferência G(s) descreve a relação entre transformadas da saída e entrada com condições iniciais nulas em um sistema linear invariante no tempo. Um controlador fecha a malha comparando referência e medida, mas a realimentação não garante estabilidade.',
                'Na realimentação negativa, T(s)=G(s)/(1+G(s)H(s)). Polos de malha fechada são as raízes do denominador após simplificação compatível; o critério de estabilidade envolve todos os modos relevantes do sistema.',
                'Em controles físicos, saturação, atraso, ruído, limites do atuador e dinâmica não modelada podem alterar o comportamento previsto por uma função linear de baixa ordem.'
            ], equations: ['T(s)=G(s)/(1+G(s)H(s))', 'Forma padrão: T(s)=ωn²/[s²+2ζωn s+ωn²]'], question: 'Um processo com alta realimentação negativa sempre responde mais rápido e sem oscilação?', answer: 'Não. A localização dos polos e as limitações físicas definem estabilidade, oscilação e transitórios.' },
        { title: '2. Caso de projeto com sobressinal', explanation: [

                'As métricas usuais a seguir são aproximações para modelo de segunda ordem subamortecido sem zeros dominantes e entrada em degrau.'
            ], steps: [
                'Feche a malha: T(s)=25/[s(s+4)+25]=25/(s²+4s+25).',
                'Compare com s²+2ζωn s+ωn²: ωn²=25, logo ωn=5 rad/s; 2ζωn=4, portanto ζ=4/10=0,4.',
                'Polos: s=[−4±√(16−100)]/2=−2±j√21≈−2±j4,583. Partes reais negativas: estável no modelo.',
                'Sobressinal relativo ideal: M_p=e^[−πζ/√(1−ζ²)]≈e^(−1,3711)=0,2538, aproximadamente 25,4%.',
                'Tempo de pico: t_p=π/[ωn√(1−ζ²)]≈0,686 s.',
                'Tempo de acomodação pela aproximação de 2%: t_s≈4/(ζωn)=4/2=2 s.',
                'Ganho estático T(0)=25/25=1; a saída tende à referência unitária, mas não sem ultrapassagem transitória.'
            ], equations: ['M_p=exp[−πζ/√(1−ζ²)]', 't_p=π/(ωn√(1−ζ²))', 't_s≈4/(ζωn) (aproximação de 2%)'], question: 'Se a estabilidade foi confirmada, por que pode ocorrer sobressinal?', answer: 'Estabilidade assintótica indica decaimento final dos modos; polos complexos conjugados ainda podem causar oscilação e ultrapassagem da referência.' },
        { title: '3. Passos de projeto responsável', explanation: [
                'No projeto real, ajuste ganhos com critérios de margem de fase e ganho, banda passante e rejeição de perturbações. Aumentar banda pode amplificar ruído e exigir velocidade de atuação que o processo físico não alcança.',
                'Para controladores digitais, período de amostragem e atraso de processamento importam. Converter um modelo contínuo sem considerar zero-order hold, quantização e saturação pode invalidar o desempenho previsto.',

    ], ['Polos determinam modos de resposta, não apenas ganho DC.', 'Sobressinal, tempo de pico e acomodação dependem do amortecimento.', 'Modelos precisam ser confrontados com limites e testes do processo.'], base),

        { title: '1. Três problemas diferentes de uma medição digital', explanation: [
                'Amostragem discretiza o tempo; quantização discretiza a amplitude; duração da janela influencia resolução em frequência. Aumentar apenas o número de bits não remove aliasing, e aumentar apenas a taxa de amostragem não garante alta resolução espectral quando o registro é muito curto.',
