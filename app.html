    q('CASO-001', 'EE06', 'circuito-ohm', 'Análise nodal de rede com duas fontes', 'Uma fonte de 24 V alimenta, por um resistor de 6 Ω, o nó A. O nó A conecta-se ao terra por 12 Ω e ao nó B por 4 Ω. O nó B conecta-se ao terra por 8 Ω e recebe uma fonte ideal de corrente de 1 A, do terra para B. Em regime permanente CC e com componentes ideais, quais são os potenciais nodais V_A e V_B, respectivamente?', ['12 V e 14 V', '14 V e 12 V', '18 V e 10 V', '16 V e 8 V', '8 V e 16 V'], 1, 'Escreva KCL em A: (VA−24)/6+VA/12+(VA−VB)/4=0, isto é 2VA−VB=16. Em B: (VB−VA)/4+VB/8−1=0, isto é −2VA+3VB=8. Resolvendo: VA=14 V, VB=12 V. Verifique: de 24 V para A fluem 1,667 A; de A para terra 1,167 A e de A para B 0,50 A. Em B, 0,50 A mais a fonte de 1 A alimentam 1,50 A no resistor de 8 Ω.', ['Defina o sentido das correntes saindo dos nós.', 'A fonte de 1 A entra em B, portanto contribui com −1 A no somatório de saídas.', 'Multiplique as equações por 12 e 8 e resolva o sistema.'], '(VA-24)/6+VA/12+(VA-VB)/4=0; (VB-VA)/4+VB/8-1=0; VA=14; VB=12', ['Inversão de nós por interpretar a fonte de 1 A com sinal errado.', 'Potenciais obtidos por reduzir indevidamente o circuito a série/paralelo.', 'Desprezo da corrente no resistor de 12 Ω.', 'Erro de sinal ao tratar o resistor de 4 Ω.']),
    q('CASO-002', 'EE06', 'circuito-ohm', 'Conferência independente de potência', 'Considere o mesmo circuito: fonte de 24 V ligada ao nó A por 6 Ω, A aterrado por 12 Ω e conectado a B por 4 Ω, B aterrado por 8 Ω e com fonte de corrente de 1 A do terra para B. Sabendo que V_A=14 V e V_B=12 V, qual é a soma das potências dissipadas nos quatro resistores?', ['28 W', '40 W', '46 W', '52 W', '64 W'], 3, 'Use P=ΔV²/R para cada resistor: P6Ω=(24−14)²/6≈16,667 W; P12Ω=14²/12≈16,333 W; P4Ω=(14−12)²/4=1 W; P8Ω=12²/8=18 W. Soma 52 W. Método independente: a fonte de 24 V entrega 24·(10/6)=40 W e a fonte de 1 A entrega 12·1=12 W. O balanço de energia fecha em 52 W.', ['Tensão em um resistor é a diferença entre seus dois terminais.', 'Some os quatro valores de ΔV²/R.', 'Confira pela soma das potências fornecidas pelas duas fontes.'], '100/6+196/12+4/4+144/8=52 W', ['Ignora a potência da fonte de corrente.', 'Confunde fornecimento da fonte de tensão com dissipação total.', 'Esquece um ramo resistivo.', 'Usa tensões absolutas em vez de diferenças.']),
    q('CASO-003', 'EE11', 'potencia-trifasica', 'Correção de FP com potência e corrente', 'Uma instalação trifásica equilibrada opera a 400 V de linha, 230 kW ativos e FP de deslocamento 0,76 indutivo. Propõe-se elevar o FP para 0,96 por capacitores ideais, mantendo a potência ativa. Sem perdas adicionais e em regime senoidal, indique o banco aproximado e a corrente de linha final.', ['67 kvar e 437 A', '130 kvar e 346 A', '197 kvar e 346 A', '130 kvar e 437 A', '230 kvar e 288 A'], 1, 'Primeiro Qi=P·tan(arccos0,76)≈196,69 kvar. Depois Qf=P·tan(arccos0,96)≈67,08 kvar; Qc≈129,60 kvar. A nova corrente é I=P/(√3·VL·FPf)=230000/(√3·400·0,96)≈345,81 A. O valor é dimensionamento ideal preliminar; harmônicos, estágio de compensação e sobretensão requerem verificação específica.', ['Calcule Qi e Qf separadamente.', 'O banco é a diferença de Q, não Q total inicial.', 'A corrente final usa o FP de 0,96, e não o inicial.'], 'Qc=230*(sqrt(1-.76^2)/.76-sqrt(1-.96^2)/.96)=129.604 kvar; I=345.809 A', ['Q final confundido com tamanho do banco; corrente inicial mantida.', 'Banco igual à reativa inicial, sem descontar Q final.', 'Corrente não atualizada após correção.', 'Confusão entre potência ativa e reativa.']),
    q('CASO-004', 'EE11', 'potencia-trifasica', 'Perdas elétricas após compensação reativa', 'No mesmo alimentador trifásico e na mesma temperatura de operação, o fator de potência da carga melhora de 0,76 para 0,96, sem variar P, V ou a resistência dos condutores. Admitindo carga equilibrada e sinusoidal, qual é a redução percentual aproximada das perdas Joule no alimentador?', ['12,0%', '20,8%', '37,3%', '58,3%', '79,2%'], 2, 'Como I=P/(√3VFP) para mesma potência e tensão, a razão de correntes é I2/I1=FP1/FP2=0,76/0,96≈0,79167. As perdas térmicas são proporcionais a I²R; logo P2/P1=(0,79167)²≈0,62674. Redução=1−0,62674≈0,37326=37,3%. Atenção: a economia de energia de toda a fábrica NÃO é 37,3%; trata-se dessa parcela de perdas, sob hipóteses fixas.', ['Compare as correntes antes e depois.', 'Perda nos condutores é proporcional ao quadrado da corrente.', 'Subtraia de 100% a fração de perda remanescente.'], '(1-(.76/.96)^2)*100=37.3264%', ['Subtrai diretamente fatores de potência.', 'Confunde redução de corrente com redução I².', 'Alternativa correta.', 'Assume proporcionalidade linear com FP.']),
    q('CASO-005', 'EE11', 'curto-circuito-pu', 'Falta trifásica com mudança de base', 'Para um ponto de falta de 13,8 kV, represente uma fonte por j0,08 pu em 20 MVA, um transformador por j0,12 pu na mesma base e um alimentador por j0,03 pu em 10 MVA, todos na tensão-base de 13,8 kV. Fonte pré-falta de 1 pu, falta trifásica franca, resistências e outras contribuições desprezadas. Qual é a corrente simétrica aproximada?', ['2,09 kA', '3,22 kA', '3,64 kA', '4,40 kA', '8,37 kA'], 1, 'Converta X do alimentador para a potência-base comum: 0,03·(20/10)=0,06 pu. Soma X=0,08+0,12+0,06=0,26 pu. Corrente-base Ib=20 MVA/(√3·13,8 kV)=836,7 A. Falta If=Ib/0,26≈3218 A, isto é 3,22 kA. Conferência independente: Zb=13,8²/20≈9,522 Ω e Zth=0,26·9,522≈2,476 Ω; I=13,8 kV/(√3·2,476 Ω)≈3,22 kA.', ['As três impedâncias devem estar na mesma base.', 'Converta 0,03 pu da base de 10 para 20 MVA.', 'Ibase=S/(√3V) e Ifpu=1/Xpu.'], '20e6/(sqrt(3)*13.8e3)/(.08+.12+.03*20/10)=3218.229 A', ['Aplica diretamente o curto da máquina de exemplo anterior.', 'Alternativa correta.', 'Soma incorreta de reatâncias.', 'Não converte a impedância de 10 MVA.']),
    q('CASO-006', 'EE15', 'maquina-inducao', 'Indução: torque, perdas e escorregamento', 'Um motor de indução de seis polos, 60 Hz, opera a 1164 rpm. Ele absorve 90 kW elétricos e fornece 81 kW mecânicos úteis no eixo. Admitindo regime permanente, qual conjunto corresponde ao escorregamento, rendimento e torque útil aproximados?', ['2%, 90% e 442 N·m', '3%, 81% e 665 N·m', '3%, 90% e 665 N·m', '6%, 90% e 690 N·m', '3%, 100% e 738 N·m'], 2, 'ns=120·60/6=1200 rpm. s=(1200−1164)/1200=0,03=3%. η=81/90=0,90=90%. ω=2π·1164/60≈121,89 rad/s. Torque útil=T=Pout/ω=81000/121,89≈664,5 N·m. Não use potência elétrica de entrada para torque útil; existem perdas de 9 kW no conjunto.', ['Use o número TOTAL de polos na velocidade síncrona.', 'O rendimento é P mecânica útil dividido por P elétrica de entrada.', 'Converta rpm em rad/s antes de calcular torque.'], 'ns=1200 rpm; s=.03; eta=.90; T=81000/(2*pi*1164/60)=664.513 Nm', ['Rotação síncrona errada por trocar polos por pares.', 'Confunde rendimento com potência útil em relação à nominal.', 'Alternativa correta.', 'Usa 60 como frequência rotórica.']),
    q('CASO-007', 'EE06', 'transitorios-rlc', 'Resposta RC com pré-carga e valor final', 'Um capacitor de 220 µF está inicialmente a 8 V. Em t=0, conecta-se por 4 kΩ a uma fonte CC ideal de 20 V, sem outros ramos. Qual a tensão no capacitor aproximadamente em t=1,76 s?', ['12,00 V', '15,59 V', '18,38 V', '19,00 V', '20,00 V'], 2, 'τ=R·C=4000·220·10⁻⁶=0,88 s; t/τ=2. A resposta é vC=20+(8−20)e^(−t/τ)=20−12e^(−2)≈18,376 V. A tensão não salta instantaneamente ao nível final de 20 V. A corrente no instante é (20−18,376)/4000≈0,406 mA.', ['A condição inicial é 8 V, não zero.', 'Escreva v(t)=v∞+(v0−v∞)exp(−t/τ).', 'Em dois τ, exp(−2)≈0,1353.'], '20-12*exp(-2)=18.3759766 V', ['Usa metade da variação como resposta.', 'Usa e^(−1) em vez de e^(−2).', 'Alternativa correta.', 'Assume instantaneamente estado de regime.']),
    q('CASO-008', 'EE18', 'controle-malha', 'Ganho, polos e sobressinal de um controle', 'Uma planta G(s)=25/[s(s+4)] opera com realimentação negativa unitária. Considere modelo linear, degrau unitário e dinâmica de segunda ordem sem zeros. Qual aproximadamente o sobressinal percentual e o tempo de acomodação de 2% (aproximação usual)?', ['0% e 0,8 s', '9% e 4 s', '16% e 2 s', '25,4% e 2 s', '52,7% e 0,8 s'], 3, 'T(s)=25/(s²+4s+25). Compare com s²+2ζωn s+ωn²: ωn=5 rad/s e ζ=4/(2·5)=0,4. Sobressinal Mp=exp[−πζ/√(1−ζ²)]=0,2538=25,4%. Tempo de acomodação 2% aproximadamente 4/(ζωn)=4/2=2 s. Os polos −2±j√21 garantem estabilidade no modelo; estabilidade não exclui sobressinal.', ['Feche a malha antes de ler coeficientes.', 'Use 2ζωn=4 e ωn²=25.', 'Para 2%, ts≈4/(ζωn); para Mp use a expressão exponencial.'], 'zeta=.4,wn=5,Mp=exp(-pi*.4/sqrt(1-.4^2))=.2538267,ts≈2', ['Confunde ganho DC unitário com ausência de sobressinal.', 'Aplica ζ inadequado.', 'Erra fórmula de amortecimento.', 'Alternativa correta.']),
    q('CASO-009', 'EE05', 'nyquist', 'Espectro de vibração com sinal dobrado', 'Uma aquisição de vibração mede uma máquina a 1000 amostras/s durante 4096 pontos. Há componentes físicas de 70 Hz e 930 Hz na entrada, mas nenhum filtro anti-aliasing. Qual alternativa descreve corretamente o espectro observado?', ['Componentes separadas em 70 Hz e 930 Hz; Δf=0,244 Hz', 'A componente de 930 Hz desaparece; Δf=1 Hz', 'As duas componentes se sobrepõem em 70 Hz; Δf≈0,244 Hz', 'As duas aparecem em 430 Hz; Δf≈4 Hz', '930 Hz é reproduzido em 500 Hz; Δf≈0,5 Hz'], 2, 'Nyquist=fs/2=500 Hz. A componente de 930 Hz sofre aliasing para |930−1000|=70 Hz, coincidindo com a de 70 Hz. O espaçamento entre bins é Δf=fs/N=1000/4096≈0,24414 Hz. Aumentar N aumenta a duração e diminui Δf, mas não elimina aliasing. É necessário filtro analógico ou taxa de amostragem adequadamente maior.', ['Calcule fs/2 primeiro.', 'Use |f−kfs| para a frequência alias no intervalo permitido.', 'A resolução nominal é fs/N, não N/fs.'], 'fabs(930-1000)=70Hz; 1000/4096=.244140625Hz', ['Ignora o dobramento acima de Nyquist.', 'Confunde taxa com faixa espectral.', 'Alternativa correta.', 'Aplica fórmula de resolução invertida.']),
    q('CASO-010', 'EE19', 'estatistica', 'Alarme de condição rara — Bayes aplicado', 'Uma condição de falha ocorre em 0,5% das máquinas. Um detector indica positivo em 98% dos casos com falha e em 2% das máquinas sem falha. Após um teste positivo, qual a probabilidade aproximada de a máquina realmente apresentar a falha?', ['2,0%', '19,8%', '49,0%', '80,2%', '98,0%'], 1, 'P(F)=0,005. P(+∩F)=0,005·0,98=0,0049. P(+∩¬F)=0,995·0,02=0,0199. P(+)=0,0248. Aplicando Bayes, P(F|+)=0,0049/0,0248≈0,19758 (19,8%). Conferência: em 100000 máquinas, aproximadamente 490 alertas verdadeiros e 1990 falsos, logo 490/2480≈19,8%. Sensibilidade não equivale a probabilidade de falha após alarme.', ['Considere a prevalência de 0,005.', 'Calcule a taxa de positivos entre saudáveis.', 'Divida os positivos verdadeiros por todos os positivos.'], '(.005*.98)/(.005*.98+.995*.02)=.1975806452', ['Confunde falso positivo com valor preditivo.', 'Alternativa correta.', 'Desconsidera totalmente a taxa-base.', 'Confunde sensibilidade com posterior.']),
    q('CASO-011', 'EE19', 'estatistica', 'Proteção redundante — votação 2 de 3', 'Três sensores independentes e idênticos têm probabilidade de 95% de detectar corretamente uma condição. Uma proteção atua com ao menos duas detecções. Admitindo independência e lógica ideal, qual a probabilidade de atuação correta?', ['90,25%', '95,00%', '97,50%', '99,275%', '99,9875%'], 3, 'A atuação tem dois casos mutuamente exclusivos: exatamente dois sensores detectam (3p²(1−p)) e os três detectam (p³). Para p=0,95: 3·0,95²·0,05+0,95³=0,135375+0,857375=0,99275, ou 99,275%. Em análise real, falhas comuns, cabos e fonte de alimentação quebram a independência.', ['Conte exatamente duas detecções.', 'Some o evento com três detecções.', 'Use distribuição binomial com n=3.'], '3*.95^2*.05+.95^3=.99275', ['Representa apenas P(duas primeiras funcionarem).', 'Usa sucesso de um único canal.', 'Subtrai probabilidades incorretamente.', 'Alternativa correta.']),
    q('CASO-012', 'EE09', 'eletronica-potencia', 'Retificação trifásica com ondulação', 'Uma ponte trifásica ideal de seis diodos, alimentada em 400 V RMS entre linhas a 60 Hz, opera com corrente CC de saída contínua de 20 A, sem sobreposição de comutação. Quais são aproximadamente a tensão média CC, frequência característica da ondulação e potência CC média?', ['400 V, 60 Hz, 8,0 kW', '540 V, 120 Hz, 10,8 kW', '566 V, 360 Hz, 11,3 kW', '540 V, 360 Hz, 10,8 kW', '690 V, 360 Hz, 13,8 kW'], 3, 'Para a ponte trifásica ideal de seis pulsos com corrente contínua, Vdc≈1,35·VLL=1,35·400=540 V. A ondulação característica é 6·frede=6·60=360 Hz. Potência média Pdc≈Vdc·Idc=540·20=10800 W=10,8 kW. Hipóteses importam: ponte monofásica, capacitor dominante ou corrente descontínua exigem outro modelo.', ['Uma ponte trifásica de seis pulsos usa 1,35 vezes VLL em hipóteses específicas.', 'O ripple dominante é 6 vezes a frequência da rede.', 'Potência CC média é tensão média vezes corrente CC constante.'], '1.35*400=540V;6*60=360Hz;540*20=10.8kW', ['Usa a tensão de linha como média DC.', 'Usa ondulação monofásica de onda completa.', 'Confunde valor de pico de tensão de linha com média retificada.', 'Alternativa correta.']),
    q('CASO-013', 'EE14', 'instrumentacao', 'Pt100 — erro por cabos de dois fios', 'Um Pt100 é modelado localmente por R=100(1+0,00385T) Ω. A conexão de dois fios acrescenta 0,5 Ω em cada condutor, e o instrumento interpreta toda a resistência como se fosse do sensor. Qual erro positivo de temperatura aproximadamente é introduzido apenas pelos fios?', ['0,26 °C', '1,30 °C', '2,60 °C', '5,20 °C', '10,0 °C'], 2, 'Os cabos adicionam 1,0 Ω ao valor medido. Na linearização indicada, dR/dT=100·0,00385=0,385 Ω/°C. Erro equivalente ΔT=1/0,385≈2,597 °C. A correção não cobre não linearidade, autoaquecimento, condições de referência nem outras incertezas. Ligações três ou quatro fios podem compensar resistência de cabo sob condições adequadas.', ['Some resistência dos dois cabos.', 'Calcule a sensibilidade dR/dT do modelo linear.', 'Divida o erro em ohms pelo número de ohms por grau.'], '(0.5+0.5)/(100*.00385)=2.5974 Celsius', ['Usa um décimo da resistência de cabo.', 'Considera apenas um fio.', 'Alternativa correta.', 'Duplica indevidamente a contribuição.']),
    q('CASO-014', 'EE14', 'instrumentacao', 'Incerteza padrão e expandida', 'Em uma medição de temperatura, duas contribuições independentes de incerteza padrão são u1=0,20 °C e u2=0,30 °C. Supondo soma quadrática aplicável e fator de abrangência k=2, qual a incerteza expandida aproximada?', ['0,36 °C', '0,50 °C', '0,60 °C', '0,72 °C', '1,00 °C'], 3, 'Combine as contribuições padrão independentes: uc=√(u1²+u2²)=√(0,20²+0,30²)=√0,13≈0,36056 °C. Com k=2, U=2uc≈0,72111 °C, isto é aproximadamente 0,72 °C. Não interprete k=2 automaticamente como 95% de cobertura sem analisar distribuições e graus de liberdade.', ['Soma incertezas padrão por raiz de soma de quadrados.', 'Depois multiplique pelo fator k=2.'], '2*sqrt(.2^2+.3^2)=.721110255 Celsius', ['Incerteza combinada confundida com expandida.', 'Soma aritmética antes do fator.', 'Valor com k inadequado.', 'Alternativa correta.'])
];

const LESSONS = [
    lesson('circuito-ohm', 'EE06', 'Lei de Ohm, potência e circuitos resistivos', 'Aprenda a calcular tensão, corrente, resistência e dissipação, mesmo que tenha esquecido a matéria.', [
        'Tensão (V) é a diferença de potencial que impulsiona a corrente. Corrente (A) é o fluxo de carga. Resistência (Ω) limita a passagem de corrente.', 'Em resistores ideais, a corrente aumenta com a tensão e diminui quando a resistência cresce.', 'Em série, a mesma corrente percorre os elementos; em paralelo, todos recebem a mesma tensão.', 'A lei dos nós de Kirchhoff diz que a soma das correntes que entram em um nó é igual à soma das que saem.'

            const a = attemptsActive();

                a.index = Math.max(0, Math.min(a.questionIds.length - 1, a.index + (d.action === 'next-attempt' ? 1 : -1)));
                persist();
                render();
            }
            break;
        }
        case 'leave-attempt':
            activeAttempt = null;
            go('sim');
            break;
        case 'pause-attempt': {
            const a = attemptsActive();
            if (a && a.mode === 'practice') {
                if (a.pauseSince) {
                    const delta = Date.now() - a.pauseSince;
                    a.pausedSeconds += delta / 1000;
                    a.endsAt += delta;
                    a.pauseSince = null;
                }
                else
                    a.pauseSince = Date.now();
                persist();
                render();
            }
            break;
        }
        case 'finish-attempt':
            finishAttempt();
            break;
        case 'save-discursive':
            persist();
            flash('Rascunho salvo.');
            break;
        case 'export': {
            const json = JSON.stringify(progress, null, 2), filename = `enade-backup-${new Date().toISOString().slice(0, 10)}.json`;
            const native = window.AndroidBackup;
            if (native) {
                native.exportBackup(json, filename);
                break;
            }
            const blob = new Blob([json], { type: 'application/json' }), url = URL.createObjectURL(blob), link = document.createElement('a');
            link.href = url;
            link.download = filename;
            link.click();
            setTimeout(() => URL.revokeObjectURL(url), 1000);
            break;
        }
        case 'sync-save-config': {
            try {
                const val = (document.querySelector('#syncConfig')?.value || '').trim();
                const config = validateFirebaseConfig(JSON.parse(val));
                localStorage.setItem(configKey, JSON.stringify(config));
                syncStatus = 'Configuração pública guardada neste navegador; login ainda necessário.';
                flash('Configuração guardada localmente.');
                render();
            }
            catch (e) {
                flash('Configuração inválida: ' + (e instanceof Error ? e.message : String(e)));
            }
            break;
        }
        case 'sync-connect':
            void connectCloud();
            break;
        case 'sync-now':
            void cloudSync();
            break;
        case 'sync-signout':
            void (async () => { await syncEngine?.signOut(); syncEngine = null; syncUid = ''; syncEmail = ''; syncStatus = 'Desconectado: dados locais preservados'; render(); })();
            break;
        case 'delete-all':
            if (confirm('Tem certeza que deseja apagar todas as suas respostas, aulas e rascunhos neste dispositivo?')) {
                progress = initialProgress();
                persist();
                go('home');
                flash('Dados locais apagados.');
            }
            break;
    }
});

        URL.revokeObjectURL(offlinePdfs[year]); offlinePdfs[year] = URL.createObjectURL(file); render(); flash(`Caderno ${year} guardado neste dispositivo.`); }).catch(err => alert(`Falha ao importar caderno: ${err.message}`));
    return;
} if (t.id === 'restore-file') {
    const file = t.files?.[0];

        return;

        progress = parsed;
