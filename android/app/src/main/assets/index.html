<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meu Ponto</title><style>body{font:16px system-ui;background:#faf8f5;color:#3a2924;margin:0;display:grid;place-items:center;min-height:100dvh}main{text-align:center;padding:24px}span{font-size:48px;color:#bd7560}button{padding:12px 18px;background:#bd7560;color:white;border:0;border-radius:14px}</style></head><body><main id="status"><span>◷</span><h2>Meu Ponto</h2><p>Carregando aplicativo...</p></main><script>
(async()=>{const base='https://raw.githubusercontent.com/leonardodittmann1-maker/clioscope-updates/meu-ponto-app/app.html';const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),7500);try{const r=await fetch(base+'?v='+Date.now(),{cache:'no-store',signal:controller.signal});if(!r.ok)throw Error('status '+r.status);const html=await r.text();if(!html.includes('ponto2_records')||!html.includes('Confirme o que foi lido'))throw Error('versão inválida');clearTimeout(timer);document.open();document.write(html);document.close();}catch(e){clearTimeout(timer);location.replace('file:///android_asset/offline.html');}})();
</script></body></html>
