name: Conta Clara - Gerar instalador Android
on:
  push:
    branches: [conta-clara-app]
    paths:
      - '.github/workflows/build-conta-clara.yml'
      - 'android/**'
  workflow_dispatch:
concurrency:
  group: conta-clara-apk
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4
      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compilar APK
        run: gradle -p android :app:assembleDebug --no-daemon
      - name: Validar e preparar instalador
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ContaClara-Android.apk
          unzip -t ContaClara-Android.apk | tail -1
          ls -lh ContaClara-Android.apk
      - name: Disponibilizar APK na mesma branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ContaClara-Android.apk
          if ! git diff --cached --quiet; then
            git commit -m 'Publica instalador Conta Clara [skip ci]'
            git push origin HEAD:conta-clara-app
          fi
      - name: Disponibilizar como artefato
        uses: actions/upload-artifact@v4
        with:
          name: ContaClara-APK
          path: ContaClara-Android.apk
