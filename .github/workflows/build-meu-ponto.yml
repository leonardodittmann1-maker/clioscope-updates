name: Meu Ponto - gerar instalador
on:
  push:
    branches: [meu-ponto-app]
    paths:
      - '.github/workflows/build-meu-ponto.yml'
      - 'android/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compilar APK Android
        run: gradle -p android :app:assembleDebug --no-daemon --stacktrace
      - name: Verificar arquivo
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk MeuPonto-GitHub.apk
          unzip -t MeuPonto-GitHub.apk | tail -1
          ls -lh MeuPonto-GitHub.apk
      - name: Publicar instalador na mesma branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add MeuPonto-GitHub.apk
          if ! git diff --cached --quiet; then
            git commit -m 'Publica APK Meu Ponto [skip ci]'
            git push origin HEAD:meu-ponto-app
          fi
